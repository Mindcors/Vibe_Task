<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c232d;--line:#303846;--text:#e6edf3;--muted:#9ba7b4;--green:#2fda8a;--green2:#143d2c;--blue:#79c0ff;--yellow:#f2cc60;--red:#ff7b72;--radius:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#0d1117f2;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.brand{display:flex;gap:11px;align-items:center;font-size:20px;font-weight:800;letter-spacing:-.6px}.logo{width:34px;height:34px;background:var(--green);color:#082616;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:19px}.brand span em{color:var(--green);font-style:normal}.top-actions{display:flex;align-items:center;gap:14px}.pill{border:1px solid var(--line);padding:7px 12px;border-radius:999px;color:var(--muted);font-size:13px}.progress-mini{width:110px;height:6px;background:#303846;border-radius:8px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:7px}.progress-mini i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{border-right:1px solid var(--line);height:calc(100vh - 68px);position:sticky;top:68px;overflow:auto;padding:22px 14px}.side-label{font-size:11px;color:#768393;font-weight:800;letter-spacing:1.3px;padding:10px 12px}.course-card{padding:14px;border:1px solid var(--line);border-radius:12px;margin:2px 4px 18px;background:linear-gradient(135deg,#18271f,#151b22)}.course-card strong{display:block;font-size:14px}.course-card small{color:var(--muted)}.course-progress{height:5px;border-radius:5px;background:#303846;margin-top:13px;overflow:hidden}.course-progress div{height:100%;width:0;background:var(--green)}.navitem{width:100%;display:flex;gap:11px;align-items:center;text-align:left;border:0;background:transparent;color:#aab5c2;padding:10px 12px;border-radius:9px;margin:2px 0;font-size:13px}.navitem:hover{background:#1b222c;color:var(--text)}.navitem.active{background:#1a3328;color:var(--green);font-weight:700}.navitem .num{font-size:11px;color:#758293;width:19px}.navitem .check{margin-left:auto;color:var(--green)}.main{padding:34px clamp(20px,4vw,64px) 70px;min-width:0;max-width:1200px;width:100%;margin:0 auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:17px}.hero{background:linear-gradient(120deg,#182b23,#171e28 70%);border:1px solid #2c4a3b;border-radius:18px;padding:28px 30px;margin-bottom:27px;position:relative;overflow:hidden}.hero:after{content:"Py";position:absolute;right:30px;top:-20px;font-size:130px;font-weight:900;color:#2fda8a0b;pointer-events:none}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(27px,4vw,39px);line-height:1.14;letter-spacing:-1.3px;margin:10px 0}.hero p{color:#b6c2cd;max-width:620px;margin:0 0 19px}.hero-meta{display:flex;gap:9px;flex-wrap:wrap}.tag{font-size:12px;color:#c2ccd6;border:1px solid #3a4653;border-radius:7px;padding:5px 9px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 0 14px}.section-title h2{font-size:20px;margin:0;letter-spacing:-.4px}.section-title p{color:var(--muted);font-size:13px;margin:4px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.stat strong{display:block;font-size:25px;letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;cursor:pointer;transition:.18s;min-height:132px}.module:hover{transform:translateY(-2px);border-color:#4b6b5b}.module-top{display:flex;justify-content:space-between;align-items:center}.module-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#222d38;font-size:17px}.module h3{font-size:15px;margin:12px 0 4px}.module p{font-size:12px;color:var(--muted);margin:0}.module-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;font-size:11px;color:#82909e}.done-dot{color:var(--green)}.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,.82fr);gap:18px;align-items:start}.lesson-panel,.editor-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head strong{font-size:14px}.panel-body{padding:20px}.lesson-body h2{font-size:25px;line-height:1.2;letter-spacing:-.6px;margin:5px 0 13px}.lesson-body h3{font-size:17px;margin:24px 0 8px}.lesson-body p{color:#c3ccd5}.lesson-body li{margin:8px 0;color:#c3ccd5}.callout{border-left:3px solid var(--blue);background:#182531;padding:12px 14px;border-radius:0 9px 9px 0;margin:16px 0;color:#c9d7e3}.code{background:#0b0f14;border:1px solid #2a323d;border-radius:10px;overflow:hidden;margin:15px 0}.code-label{padding:8px 12px;border-bottom:1px solid #252d37;color:#8493a3;font-size:11px;display:flex;justify-content:space-between}.code pre{margin:0;padding:15px;overflow:auto;color:#d6e2ee;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}.kw{color:#ff7b72}.str{color:#a5d6ff}.fn{color:#d2a8ff}.editor{width:100%;min-height:220px;resize:vertical;border:0;outline:0;background:#0b0f14;color:#d6e2ee;padding:16px;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}.editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--line);background:#131820;font-size:12px;color:var(--muted)}.editor-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#222a35;color:var(--text);font-weight:650;font-size:12px}.btn:hover{filter:brightness(1.15)}.btn.primary{background:var(--green);border-color:var(--green);color:#082516}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.output{min-height:85px;background:#090d12;padding:13px 15px;color:#9be9b5;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.output.error{color:var(--red)}.output-label{display:flex;justify-content:space-between;padding:9px 13px;background:#11161d;border-top:1px solid var(--line);font-size:11px;color:#8c99a8}.quiz{border:1px solid var(--line);border-radius:12px;padding:17px;margin:20px 0;background:#131820}.quiz h3{margin:0 0 12px;font-size:15px}.answer{display:block;width:100%;text-align:left;background:#171e27;color:#c9d3dd;border:1px solid #303946;padding:11px 13px;border-radius:8px;margin:7px 0;font-size:13px}.answer:hover{border-color:#5e7185}.answer.correct{border-color:var(--green);background:#153124}.answer.wrong{border-color:var(--red);background:#351d20}.feedback{font-size:12px;margin-top:10px;color:var(--muted)}.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.notice{font-size:12px;color:var(--muted);margin-top:10px}.search{width:100%;background:#10151c;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:4px 0 14px;outline:none}.search:focus{border-color:var(--green)}.empty{color:var(--muted);padding:20px;text-align:center}.certificate{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center}.certificate h2{font-size:28px}.certificate .big{font-size:54px}.footer{border-top:1px solid var(--line);padding:22px 0;margin-top:45px;color:#7f8b99;font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.mobile-menu{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#1e3c2c;border:1px solid #367b56;color:#c9ffe0;padding:12px 16px;border-radius:10px;box-shadow:0 8px 35px #0006;z-index:30;animation:fade .2s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:1000px){.layout{grid-template-columns:235px minmax(0,1fr)}.lesson-layout{grid-template-columns:1fr}.editor-panel{order:2}.main{padding:25px 22px 55px}.sidebar{padding:17px 10px}}
@media(max-width:700px){.topbar{padding:0 14px;height:60px}.top-actions .pill{display:none}.layout{display:block}.sidebar{display:none;position:fixed;z-index:20;top:60px;left:0;bottom:0;width:290px;height:auto;background:var(--bg);box-shadow:15px 0 35px #0008}.sidebar.open{display:block}.mobile-menu{display:inline-flex}.main{padding:20px 14px 45px}.hero{padding:22px 19px}.hero:after{right:8px;font-size:95px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.module-grid{grid-template-columns:1fr}.lesson-body h2{font-size:23px}.panel-body{padding:16px}.section-title{align-items:start}.top-actions{gap:8px}}
</style>

<body>

<script>
const lessons = [
{module:"Старт в Python",icon:"🚀",desc:"Знакомство с языком и первая программа",items:[
{title:"Добро пожаловать в Python",time:"8 мин",level:"Основы",body:`<p>Python — язык программирования с понятным синтаксисом. На нём создают веб-сервисы, автоматизацию, игры, анализ данных и инструменты на базе ИИ.</p><h3>Как устроен код</h3><p>Интерпретатор выполняет инструкции. Обычно код хранится в файле с расширением <code>.py</code>.</p><div class="callout"><b>Важно:</b> Python чувствителен к отступам. Отступы показывают, какие команды относятся к одному блоку.</div><h3>Что ты освоишь</h3><ul><li>Переменные, типы данных и операции</li><li>Условия, циклы и функции</li><li>Коллекции, файлы и обработку ошибок</li><li>Модули, классы, тестирование и небольшой проект</li></ul>`,code:`print("Привет, мир!")\nprint("Я изучаю Python")`,question:"Какой командой обычно выводят текст в консоль?",answers:["echo('Привет')","print('Привет')","write('Привет')"],correct:1,explain:"Функция print() выводит значение в консоль."},
{title:"Первая программа",time:"10 мин",level:"Основы",body:`<p>Начнём с <code>print()</code>. Она выводит текст, числа и результаты выражений.</p><div class="code"><div class="code-label">Python <span>пример</span></div><pre>print("Привет!")\nprint(2 + 3)\nprint("Ответ:", 10)</pre></div><p>Текст заключают в кавычки. Числа можно использовать без кавычек. Несколько аргументов <code>print()</code> разделяются пробелом по умолчанию.</p><h3>Попробуй сам</h3><p>Выведи своё имя, а затем результат сложения 12 и 30.</p>`,code:`print("Меня зовут Алекс")\nprint(12 + 30)`,question:"Что выведет print(4 * 3)?",answers:["43","12","7"],correct:1,explain:"Звёздочка * — оператор умножения."},
{title:"Комментарии и стиль",time:"7 мин",level:"Основы",body:`<p>Комментарии помогают объяснять код. Python игнорирует текст после символа <code>#</code> на этой строке.</p><div class="code"><div class="code-label">Python</div><pre># Считаем стоимость покупки\nprice = 120\ncount = 3\ntotal = price * count\nprint(total)</pre></div><p>Пиши понятные имена переменных, разделяй смысловые части пустыми строками и придерживайся единого стиля. В Python часто используют <code>snake_case</code>: <code>user_name</code>.</p>`,code:`# Цена и количество\nprice = 120\ncount = 3\ntotal = price * count\nprint(total)`,question:"Как начинается однострочный комментарий?",answers:["//","<!--","#"],correct:2,explain:"Символ # обозначает комментарий в Python."}
]},
{module:"Переменные и типы",icon:"📦",desc:"Храним данные и работаем с ними",items:[
{title:"Переменные",time:"10 мин",level:"Основы",body:`<p>Переменная — имя, связанное со значением. Для создания переменной достаточно присвоить ей значение с помощью <code>=</code>.</p><div class="code"><div class="code-label">Python</div><pre>name = "Анна"\nage = 18\nis_student = True\nprint(name, age)</pre></div><p>Имена могут содержать буквы, цифры и подчёркивания, но не должны начинаться с цифры. Регистр важен: <code>age</code> и <code>Age</code> — разные имена.</p>`,code:`name = "Анна"\nage = 18\nis_student = True\nprint(name)\nprint(age)`,question:"Как правильно создать переменную с числом 10?",answers:["10 = number","number = 10","number == 10"],correct:1,explain:"Оператор = присваивает значение переменной."},
{title:"Типы данных",time:"12 мин",level:"Основы",body:`<p>Частые встроенные типы: <code>int</code> — целые числа, <code>float</code> — дробные, <code>str</code> — строки, <code>bool</code> — логические значения.</p><div class="code"><div class="code-label">Python</div><pre>age = 20          # int\nprice = 99.5      # float\nname = "Ира"      # str\nactive = True     # bool\nprint(type(price))</pre></div><p>Функция <code>type()</code> показывает тип значения. В Python тип определяется автоматически по присвоенному значению.</p>`,code:`age = 20\nprice = 99.5\nname = "Ира"\nactive = True\nprint(type(age))\nprint(type(name))`,question:"Какой тип у значения 3.14?",answers:["int","float","str"],correct:1,explain:"Число с дробной частью относится к типу float."},
{title:"Преобразование типов",time:"10 мин",level:"Основы",body:`<p>Данные из текстового ввода обычно приходят строкой. Для вычислений их нужно преобразовать.</p><div class="code"><div class="code-label">Python</div><pre>age_text = "18"\nage = int(age_text)\nprice = float("12.5")\nnumber = str(42)\nprint(age + 2)</pre></div><p>Используй <code>int()</code>, <code>float()</code> и <code>str()</code>. Преобразование строки в число завершится ошибкой, если строка не содержит допустимое число.</p>`,code:`number_text = "25"\nnumber = int(number_text)\nprint(number + 5)\nprint(str(number) + " лет")`,question:"Что вернёт int('12')?",answers:["Строку '12'","Число 12","Число 12.0"],correct:1,explain:"int() преобразует корректную числовую строку в целое число."}
]},
{module:"Операторы и строки",icon:"🧮",desc:"Вычисления, текст и форматирование",items:[
{title:"Арифметика и сравнения",time:"12 мин",level:"Основы",body:`<p>Python поддерживает <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>, целочисленное деление <code>//</code>, остаток <code>%</code> и степень <code>**</code>.</p><div class="code"><div class="code-label">Python</div><pre>print(7 / 2)   # 3.5\nprint(7 // 2)  # 3\nprint(7 % 2)   # 1\nprint(2 ** 3)  # 8\nprint(5 >= 3)  # True</pre></div><p>Сравнения <code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code> возвращают True или False.</p>`,code:`a = 17\nb = 5\nprint("Сумма:", a + b)\nprint("Частное:", a / b)\nprint("Остаток:", a % b)`,question:"Что вернёт выражение 10 // 3?",answers:["3.33","3","1"],correct:1,explain:"// отбрасывает дробную часть результата деления."},
{title:"Работа со строками",time:"12 мин",level:"Основы",body:`<p>Строки можно соединять через <code>+</code>, повторять через <code>*</code>, получать длину через <code>len()</code> и обращаться к символам по индексу.</p><div class="code"><div class="code-label">Python</div><pre>text = "Python"\nprint(len(text))   # 6\nprint(text[0])     # P\nprint(text[-1])    # n\nprint(text[0:3])   # Pyt\nprint(text.lower())</pre></div><p>Индексация начинается с нуля. Срез <code>[start:stop]</code> не включает позицию stop. Строки неизменяемы: методы возвращают новые строки.</p>`,code:`word = "Python"\nprint(len(word))\nprint(word[0])\nprint(word[1:4])\nprint(word.upper())`,question:"Что вернёт 'Python'[0]?",answers:["y","P","Python"],correct:1,explain:"Первый символ имеет индекс 0."},
{title:"Форматирование строк",time:"10 мин",level:"Основы",body:`<p>f-строки позволяют вставлять значения прямо в текст. Перед открывающей кавычкой ставится <code>f</code>.</p><div class="code"><div class="code-label">Python</div><pre>name = "Маша"\nage = 19\nprint(f"{name}, тебе {age} лет")\nprice = 12.345\nprint(f"{price:.2f}")</pre></div><p>Формат <code>:.2f</code> отображает число с двумя знаками после запятой. Это удобно для сообщений, отчётов и цен.</p>`,code:`product = "Кофе"\nprice = 149.9\ncount = 2\nprint(f"{product}: {count} шт.")\nprint(f"Итого: {price * count:.2f} руб.")`,question:"Как обозначается f-строка?",answers:["Префикс f перед строкой","Суффикс f после строки","Функция formatf()"],correct:0,explain:"Например: f'Привет, {name}'."}
]},
{module:"Ввод и условия",icon:"🔀",desc:"Реагируем на данные и выбираем действия",items:[
{title:"Ввод данных",time:"10 мин",level:"Основы",body:`<p>Функция <code>input()</code> получает строку от пользователя. Чтобы вводить числа, используй преобразование типов.</p><div class="code"><div class="code-label">Python</div><pre>name = input("Как тебя зовут? ")\nage = int(input("Сколько тебе лет? "))\nprint(f"Привет, {name}!")\nprint(f"Через год тебе будет {age + 1}")</pre></div><p>В этой песочнице ввод через input не поддерживается как интерактивный диалог, поэтому для экспериментов присваивай значения переменным напрямую.</p>`,code:`name = "Алекс"\nage = 18\nprint(f"Привет, {name}!")\nprint(f"Через год тебе будет {age + 1}")`,question:"Какой тип обычно возвращает input()?",answers:["int","str","bool"],correct:1,explain:"input() возвращает строку, даже если введены цифры."},
{title:"Условия if / elif / else",time:"14 мин",level:"Основы",body:`<p>Условия позволяют выполнять разные ветви кода в зависимости от значения выражения. После <code>if</code> и <code>else</code> ставится двоеточие, тело блока выделяется отступом.</p><div class="code"><div class="code-label">Python</div><pre>temperature = 18\nif temperature >= 25:\n    print("Жарко")\nelif temperature >= 15:\n    print("Комфортно")\nelse:\n    print("Прохладно")</pre></div><p>Ветви проверяются сверху вниз. Выполнится первая ветвь с истинным условием, либо блок else.</p>`,code:`score = 82\nif score >= 90:\n    print("Отлично")\nelif score >= 70:\n    print("Хорошо")\nelse:\n    print("Нужно потренироваться")`,question:"Какая ветвь срабатывает, если все условия if/elif ложны и есть else?",answers:["Первая ветвь","Ветка else","Ни одна никогда"],correct:1,explain:"else выполняется, если предыдущие условия не подошли."},
{title:"Логические операторы",time:"12 мин",level:"Основы",body:`<p>Операторы <code>and</code>, <code>or</code> и <code>not</code> объединяют и инвертируют логические условия.</p><div class="code"><div class="code-label">Python</div><pre>age = 20\nhas_ticket = True\nif age >= 18 and has_ticket:\n    print("Вход разрешён")\n\nis_weekend = False\nprint(not is_weekend)</pre></div><p><code>and</code> требует истинности обоих условий, <code>or</code> — хотя бы одного, а <code>not</code> меняет True на False и наоборот.</p>`,code:`age = 17\nhas_permission = True\nif age >= 18 or has_permission:\n    print("Можно продолжить")\nelse:\n    print("Доступ закрыт")`,question:"Когда выражение A or B истинно?",answers:["Только если оба истинны","Если хотя бы одно истинно","Только если оба ложны"],correct:1,explain:"Для or достаточно истинности хотя бы одного операнда."}
]},
{module:"Циклы",icon:"🔁",desc:"Повторяем действия и обходим последовательности",items:[
{title:"Цикл for и range()",time:"13 мин",level:"Основы",body:`<p><code>for</code> перебирает элементы последовательности. <code>range(stop)</code> генерирует числа от 0 до stop, не включая stop.</p><div class="code"><div class="code-label">Python</div><pre>for number in range(5):\n    print(number)\n\nfor number in range(2, 7):\n    print(number)</pre></div><p>У range можно указать начало, конец и шаг: <code>range(start, stop, step)</code>.</p>`,code:`total = 0\nfor number in range(1, 6):\n    total += number\nprint("Сумма:", total)`,question:"Какие числа создаёт range(2, 5)?",answers:["2, 3, 4","2, 3, 4, 5","0, 1, 2, 3, 4"],correct:0,explain:"Правая граница range не включается."},
{title:"Цикл while",time:"12 мин",level:"Основы",body:`<p><code>while</code> повторяет блок, пока условие истинно. Следи, чтобы условие могло стать ложным, иначе получится бесконечный цикл.</p><div class="code"><div class="code-label">Python</div><pre>count = 3\nwhile count > 0:\n    print(count)\n    count -= 1\nprint("Старт!")</pre></div><p>Внутри цикла можно менять переменные, проверяемые условием.</p>`,code:`number = 1\nwhile number <= 5:\n    print(number * number)\n    number += 1`,question:"Что нужно контролировать в цикле while?",answers:["Чтобы условие могло завершить цикл","Чтобы не было переменных","Чтобы всегда был input()"],correct:0,explain:"Без изменения состояния условие может оставаться истинным бесконечно."},
{title:"break, continue и циклы",time:"12 мин",level:"Основы",body:`<p><code>break</code> немедленно завершает ближайший цикл. <code>continue</code> пропускает остаток текущей итерации и переходит к следующей.</p><div class="code"><div class="code-label">Python</div><pre>for number in range(1, 8):\n    if number == 3:\n        continue\n    if number == 6:\n        break\n    print(number)</pre></div><p>Циклы можно вкладывать друг в друга, но чрезмерная вложенность затрудняет чтение. Часто полезно вынести логику в функцию.</p>`,code:`for number in range(1, 11):\n    if number % 2 == 0:\n        continue\n    print(number)`,question:"Что делает continue?",answers:["Завершает всю программу","Пропускает текущую итерацию","Перезапускает Python"],correct:1,explain:"continue переходит к следующей итерации цикла."}
]},
{module:"Коллекции",icon:"🧺",desc:"Списки, кортежи, множества и словари",items:[
{title:"Списки",time:"14 мин",level:"Средний",body:`<p>Список <code>list</code> хранит упорядоченную последовательность элементов. Он изменяемый: можно добавлять, удалять и менять значения.</p><div class="code"><div class="code-label">Python</div><pre>fruits = ["яблоко", "груша"]\nfruits.append("банан")\nfruits[0] = "персик"\nprint(fruits)\nprint(len(fruits))</pre></div><p>Полезные методы: <code>append()</code>, <code>extend()</code>, <code>remove()</code>, <code>pop()</code>, <code>sort()</code>. Индексы и срезы работают так же, как у строк.</p>`,code:`numbers = [5, 2, 9, 1]\nnumbers.append(7)\nnumbers.sort()\nprint(numbers)\nprint("Количество:", len(numbers))`,question:"Как добавить один элемент в конец списка?",answers:["list.add_end(x)","list.append(x)","list.push(x)"],correct:1,explain:"Метод append() добавляет элемент в конец списка."},
{title:"Кортежи и множества",time:"12 мин",level:"Средний",body:`<p>Кортеж <code>tuple</code> похож на список, но обычно не изменяется после создания. Множество <code>set</code> хранит уникальные элементы и удобно для удаления повторов.</p><div class="code"><div class="code-label">Python</div><pre>point = (10, 20)\ntags = {"python", "code", "python"}\nprint(point[0])\nprint(tags)\nprint(2 in {1, 2, 3})</pre></div><p>У множества нет гарантированного порядка вывода. Пустое множество создаётся через <code>set()</code>, потому что <code>{}</code> — это пустой словарь.</p>`,code:`values = [1, 2, 2, 3, 3, 3]\nunique_values = set(values)\nprint(unique_values)\npoint = (10, 20)\nprint(point[1])`,question:"Что удобно использовать для удаления дубликатов?",answers:["set","float","bool"],correct:0,explain:"Множество хранит только уникальные значения."},
{title:"Словари",time:"14 мин",level:"Средний",body:`<p>Словарь <code>dict</code> хранит пары «ключ — значение». По ключу можно быстро получить или обновить значение.</p><div class="code"><div class="code-label">Python</div><pre>user = {"name": "Ира", "age": 20}\nprint(user["name"])\nuser["city"] = "Казань"\nuser["age"] += 1\nfor key, value in user.items():\n    print(key, value)</pre></div><p>Для безопасного чтения можно использовать <code>get()</code>: если ключа нет, вернётся значение по умолчанию, а не возникнет KeyError.</p>`,code:`product = {"name": "Книга", "price": 450}\nproduct["quantity"] = 2\nprint(product["name"])\nprint(product.get("discount", 0))\nprint(product["price"] * product["quantity"])`,question:"Что хранит словарь?",answers:["Только числа","Пары ключ — значение","Только уникальные символы"],correct:1,explain:"Каждому ключу словаря соответствует значение."}
]},
{module:"Функции",icon:"🧩",desc:"Переиспользуем код и разбиваем задачи",items:[
{title:"Создание функций",time:"14 мин",level:"Средний",body:`<p>Функция — именованный блок кода. Она объявляется через <code>def</code>. Функции помогают не повторять код и давать логике понятные имена.</p><div class="code"><div class="code-label">Python</div><pre>def greet(name):\n    print(f"Привет, {name}!")\n\ngreet("Оля")\ngreet("Иван")</pre></div><p>Параметр — имя в определении функции, аргумент — конкретное значение при вызове.</p>`,code:`def square(number):\n    print(number * number)\n\nsquare(4)\nsquare(9)`,question:"Как объявить функцию в Python?",answers:["function greet():","def greet():","func greet()"],correct:1,explain:"Ключевое слово для объявления функции — def."},
{title:"return и параметры",time:"14 мин",level:"Средний",body:`<p><code>return</code> возвращает результат вызывающему коду и завершает функцию. Это отличается от <code>print()</code>, который только выводит значение.</p><div class="code"><div class="code-label">Python</div><pre>def add(a, b=0):\n    return a + b\n\nresult = add(4, 3)\nprint(result)\nprint(add(10))</pre></div><p>Параметрам можно задавать значения по умолчанию. После параметров со значениями по умолчанию нельзя ставить обычные обязательные параметры.</p>`,code:`def calculate_total(price, quantity=1):\n    return price * quantity\n\nprint(calculate_total(100, 3))\nprint(calculate_total(75))`,question:"Что делает return?",answers:["Всегда печатает результат","Возвращает значение из функции","Создаёт переменную глобально"],correct:1,explain:"Возвращённое значение можно сохранить и использовать дальше."},
{title:"Область видимости и lambda",time:"13 мин",level:"Средний",body:`<p>Переменная, созданная внутри функции, обычно локальна для неё. Лучше передавать данные через параметры и возвращать результат, чем менять глобальные переменные.</p><div class="code"><div class="code-label">Python</div><pre>def double(x):\n    return x * 2\n\nsquare = lambda x: x * x\nprint(double(5))\nprint(square(5))</pre></div><p><code>lambda</code> — компактная анонимная функция из одного выражения. Для сложной логики используй обычный <code>def</code>.</p>`,code:`def is_even(number):\n    return number % 2 == 0\n\nnumbers = [1, 2, 3, 4, 5, 6]\nevens = list(filter(is_even, numbers))\nprint(evens)`,question:"Для чего чаще всего подходит lambda?",answers:["Для небольшого простого выражения","Для замены всего Python","Для создания класса обязательно"],correct:0,explain:"lambda полезна для коротких функций, часто передаваемых другим функциям."}
]},
{module:"Ошибки и файлы",icon:"🛠️",desc:"Обрабатываем сбои и сохраняем данные",items:[
{title:"Ошибки и исключения",time:"14 мин",level:"Средний",body:`<p>Ошибки бывают синтаксическими и возникающими во время выполнения. Блоки <code>try</code>/<code>except</code> позволяют обработать ожидаемые исключения.</p><div class="code"><div class="code-label">Python</div><pre>try:\n    number = int("не число")\nexcept ValueError:\n    print("Нужно ввести целое число")\nelse:\n    print(number)\nfinally:\n    print("Готово")</pre></div><p>Не перехватывай все исключения без необходимости. Лови конкретный тип ошибки и сообщай пользователю, что можно сделать.</p>`,code:`text = "abc"\ntry:\n    value = int(text)\nexcept ValueError:\n    print("Ошибка: строка не является числом")`,question:"Какое исключение обычно возникает при int('abc')?",answers:["ValueError","IndexError","NameError"],correct:0,explain:"ValueError возникает, когда тип подходит, но значение нельзя преобразовать."},
{title:"Чтение и запись файлов",time:"14 мин",level:"Средний",body:`<p>Функция <code>open()</code> открывает файл. Контекстный менеджер <code>with</code> автоматически закрывает его после завершения блока.</p><div class="code"><div class="code-label">Python</div><pre>with open("notes.txt", "w", encoding="utf-8") as file:\n    file.write("Изучаю Python\\n")\n\nwith open("notes.txt", "r", encoding="utf-8") as file:\n    content = file.read()\n    print(content)</pre></div><p>Режимы: <code>r</code> — чтение, <code>w</code> — запись с перезаписью, <code>a</code> — добавление в конец. Здесь браузерная песочница не имеет доступа к локальной файловой системе, поэтому пример изучай как обычный Python-код.</p>`,code:`# Пример работы с файлом в обычном Python\nwith open("notes.txt", "w", encoding="utf-8") as file:\n    file.write("Первая заметка")\n\nwith open("notes.txt", "r", encoding="utf-8") as file:\n    print(file.read())`,question:"Зачем использовать with open(...) as file?",answers:["Файл автоматически закрывается","Файл становится публичным","Код запускается быстрее всегда"],correct:0,explain:"Контекстный менеджер освобождает ресурс после выхода из блока."},
{title:"Модули и pip",time:"12 мин",level:"Средний",body:`<p>Модуль — файл Python, который можно импортировать. Импортируй только то, что нужно, и избегай имён файлов, совпадающих с названиями стандартных модулей.</p><div class="code"><div class="code-label">Python</div><pre>import math\nfrom random import randint\n\nprint(math.sqrt(81))\nprint(randint(1, 6))</pre></div><p><code>pip</code> устанавливает сторонние пакеты, например <code>python -m pip install requests</code>. Для проектов полезно создавать виртуальное окружение через <code>python -m venv .venv</code>.</p>`,code:`import math\n\nradius = 4\narea = math.pi * radius ** 2\nprint(f"Площадь круга: {area:.2f}")`,question:"Как импортировать стандартный модуль math целиком?",answers:["include math","import math","pip math"],correct:1,explain:"Оператор import подключает модуль."}
]},
{module:"Продвинутые основы",icon:"⚙️",desc:"Генераторы, ООП, тесты и качество кода",items:[
{title:"List comprehensions",time:"12 мин",level:"Продвинутый",body:`<p>Генератор списка — короткий способ создать список на основе последовательности. Внутри можно использовать условие.</p><div class="code"><div class="code-label">Python</div><pre>squares = [x * x for x in range(1, 6)]\nevens = [x for x in range(10) if x % 2 == 0]\nprint(squares)\nprint(evens)</pre></div><p>Используй comprehensions, когда выражение остаётся читаемым. Если логика сложная, обычный цикл понятнее.</p>`,code:`words = ["python", "код", "обучение"]\nupper_words = [word.upper() for word in words]\nlong_words = [word for word in words if len(word) > 4]\nprint(upper_words)\nprint(long_words)`,question:"Что создаёт выражение [x*x for x in range(3)]?",answers:["Список квадратов 0, 1, 4","Кортеж","Словарь"],correct:0,explain:"Выражение вычисляет x*x для каждого значения x."},
{title:"Основы ООП и классы",time:"16 мин",level:"Продвинутый",body:`<p>Класс описывает структуру объектов, а объект — конкретный экземпляр класса. Метод <code>__init__</code> инициализирует новый объект, а <code>self</code> ссылается на него.</p><div class="code"><div class="code-label">Python</div><pre>class Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        return f"{self.name}: гав!"\n\ndog = Dog("Бим")\nprint(dog.bark())</pre></div><p>ООП помогает объединять данные и поведение. Не обязательно использовать классы для каждой маленькой задачи: функции и простые структуры часто достаточно.</p>`,code:`class Book:\n    def __init__(self, title, author):\n        self.title = title\n        self.author = author\n\n    def describe(self):\n        return f"{self.title} — {self.author}"\n\nbook = Book("Мастер и Маргарита", "М. Булгаков")\nprint(book.describe())`,question:"Что обозначает self в методе экземпляра?",answers:["Текущий объект","Название модуля","Родительский класс всегда"],correct:0,explain:"self — ссылка на конкретный экземпляр, для которого вызван метод."},
{title:"Итераторы и генераторы",time:"14 мин",level:"Продвинутый",body:`<p>Итератор выдаёт элементы по одному. Генератор можно создать функцией с <code>yield</code>; он приостанавливает выполнение и продолжает его при следующем запросе элемента.</p><div class="code"><div class="code-label">Python</div><pre>def count_up_to(limit):\n    number = 1\n    while number <= limit:\n        yield number\n        number += 1\n\nfor item in count_up_to(3):\n    print(item)</pre></div><p>Генераторы полезны, когда последовательность большая или элементы нужно вычислять по мере необходимости.</p>`,code:`def even_numbers(limit):\n    for number in range(limit + 1):\n        if number % 2 == 0:\n            yield number\n\nprint(list(even_numbers(10)))`,question:"Что делает yield?",answers:["Удаляет функцию","Возвращает значение, сохраняя состояние генератора","Останавливает интерпретатор"],correct:1,explain:"yield приостанавливает генератор и позволяет продолжить позже."},
{title:"Тестирование и отладка",time:"14 мин",level:"Продвинутый",body:`<p>Тесты проверяют, что код ведёт себя ожидаемым образом. Встроенный <code>assert</code> помогает проверять условия, а стандартный модуль <code>unittest</code> подходит для более структурированных тестов.</p><div class="code"><div class="code-label">Python</div><pre>def add(a, b):\n    return a + b\n\nassert add(2, 3) == 5\nassert add(-1, 1) == 0\nprint("Все проверки пройдены")</pre></div><p>Отлаживай код постепенно: воспроизведи ошибку, проверь входные данные, изолируй участок и добавь тест на найденный случай.</p>`,code:`def is_palindrome(text):\n    cleaned = text.lower().replace(" ", "")\n    return cleaned == cleaned[::-1]\n\nassert is_palindrome("топот")\nassert is_palindrome("А роза упала на лапу Азора")\nassert not is_palindrome("python")\nprint("Тесты пройдены!")`,question:"Для чего нужен assert?",answers:["Для проверки условия во время выполнения","Для установки пакета","Для создания цикла"],correct:0,explain:"assert вызывает ошибку AssertionError, если проверяемое условие ложно."}
]},
{module:"Итоговый проект",icon:"🏁",desc:"Собираем знания в маленькое приложение",items:[
{title:"Проект: менеджер задач",time:"25 мин",level:"Проект",body:`<p>Финальный мини-проект — простой менеджер задач в консоли. Он использует списки, словари, функции, циклы и условия.</p><h3>План</h3><ol><li>Создай список задач.</li><li>Сделай функцию добавления задачи.</li><li>Добавь вывод списка с номерами.</li><li>Реализуй отметку выполнения.</li><li>Проверь работу на пустом списке и нескольких задачах.</li></ol><div class="callout"><b>Совет:</b> сначала сделай минимальную работающую версию, а затем добавляй улучшения — сохранение в JSON, даты и фильтры.</div><h3>Стартовый код</h3><p>В редакторе справа допиши функции просмотра и завершения задач. Запускай код и проверяй вывод.</p>`,code:`tasks = []\n\ndef add_task(title):\n    tasks.append({"title": title, "done": False})\n\ndef show_tasks():\n    if not tasks:\n        print("Список задач пуст")\n        return\n    for index, task in enumerate(tasks, start=1):\n        status = "✓" if task["done"] else " "\n        print(f"{index}. [{status}] {task['title']}")\n\ndef complete_task(number):\n    if 1 <= number <= len(tasks):\n        tasks[number - 1]["done"] = True\n\nadd_task("Изучить списки")\nadd_task("Написать функцию")\ncomplete_task(1)\nshow_tasks()`,question:"Какой тип данных удобен для хранения списка нескольких задач?",answers:["list","int","bool"],correct:0,explain:"Список подходит для хранения упорядоченной коллекции задач."}
]}
];
let current={module:0,lesson:0,view:"home"}, completed=new Set(), passed=new Set(), quizAnswers={};
const allLessons=()=>lessons.flatMap((m,mi)=>m.items.map((l,li)=>({...l,moduleIndex:mi,lessonIndex:li,moduleName:m.module})));
const all=allLessons();
const keyFor=(mi,li)=>`${mi}-${li}`;
function loadProgress(){try{completed=new Set(JSON.parse(localStorage.getItem("pypath_completed")||"[]"));passed=new Set(JSON.parse(localStorage.getItem("pypath_passed")||"[]"));}catch(e){}}
function saveProgress(){localStorage.setItem("pypath_completed",JSON.stringify([...completed]));localStorage.setItem("pypath_passed",JSON.stringify([...passed]));updateProgress();}
function updateProgress(){let pct=Math.round(completed.size/all.length*100);document.getElementById("topProgress").style.width=pct+"%";document.getElementById("topPercent").textContent=pct+"%";document.getElementById("sideProgress").style.width=pct+"%";document.getElementById("sideStats").textContent=`${completed.size} из ${all.length} уроков завершено`;}
function renderNav(){let nav=document.getElementById("lessonNav");nav.innerHTML="";lessons.forEach((m,mi)=>{let b=document.createElement("button");b.className="navitem";b.innerHTML=`<span class="num">${String(mi+1).padStart(2,"0")}</span><span style="flex:1">${m.module}</span><span class="check">${m.items.every((l,li)=>completed.has(keyFor(mi,li)))?"✓":""}</span>`;b.onclick=()=>{current={module:mi,lesson:0,view:"lesson"};render();};nav.appendChild(b);});}
function setActive(view){document.querySelectorAll(".navitem[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));}
function render(){updateProgress();renderNav();setActive(current.view);const main=document.getElementById("main");if(current.view==="lesson")renderLesson(main);else if(current.view==="all")renderAll(main);else if(current.view==="practice")renderPractice(main);else if(current.view==="certificate")renderCertificate(main);else renderHome(main);document.getElementById("sidebar").classList.remove("open");}
function renderHome(main){main.innerHTML=`<div class="crumb">Главная / Обзор</div><section class="hero"><div class="eyebrow">ИНТЕРАКТИВНАЯ ПЛАТФОРМА</div><h1>Путь от новичка<br>до уверенного Python-разработчика.</h1><p>Учи Python по шагам: короткие объяснения, примеры кода, вопросы для самопроверки и практика прямо в браузере.</p><div class="hero-meta"><span class="tag">🐍 ${all.length} уроков</span><span class="tag">⌘ Редактор кода</span><span class="tag">✓ Сохранение прогресса</span><span class="tag">Бесплатно</span></div></section><div class="stats"><div class="stat"><strong>${all.length}</strong><span>Уроков в курсе</span></div><div class="stat"><strong>${completed.size}</strong><span>Уроков завершено</span></div><div class="stat"><strong>${passed.size}</strong><span>Тестов пройдено</span></div></div><div class="section-title"><div><h2>Программа обучения</h2><p>Выбирай модуль и двигайся в собственном темпе.</p></div><button class="btn ghost" onclick="goView('all')">Все уроки →</button></div><div class="module-grid">${lessons.map((m,mi)=>`<div class="module" onclick="openModule(${mi})"><div class="module-top"><div class="module-icon">${m.icon}</div><span class="tag">${m.items.length} урока</span></div><h3>${mi+1}. ${m.module}</h3><p>${m.desc}</p><div class="module-foot"><span>${m.items.filter((l,li)=>completed.has(keyFor(mi,li))).length}/${m.items.length} завершено</span><span>${m.items.every((l,li)=>completed.has(keyFor(mi,li)))?"✓ Готово":"Начать →"}</span></div></div>`).join("")}</div><div class="footer"><span>PyPath · Учись, практикуйся, создавай.</span><span>Прогресс хранится в этом браузере.</span></div>`;}
function openModule(mi){current={module:mi,lesson:0,view:"lesson"};render();}
function goView(view){current.view=view;render();}
function renderAll(main){main.innerHTML=`<div class="crumb">Обучение / Все уроки</div><div class="section-title"><div><h2>Все уроки</h2><p>Найди нужную тему или продолжи обучение.</p></div><span class="tag">${all.length} уроков</span></div><input class="search" id="lessonSearch" placeholder="⌕ Поиск по названию или модулю..."><div id="allLessonList"></div>`;const paint=(q="")=>{let filtered=all.filter(l=>(l.title+" "+l.moduleName+" "+l.level).toLowerCase().includes(q.toLowerCase()));document.getElementById("allLessonList").innerHTML=filtered.length?filtered.map(l=>`<button class="navitem" style="padding:14px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;width:100%" onclick="openLesson(${l.moduleIndex},${l.lessonIndex})"><span class="num">${String(l.moduleIndex+1).padStart(2,"0")}.${l.lessonIndex+1}</span><span style="flex:1"><b style="display:block;color:var(--text)">${l.title}</b><small>${l.moduleName} · ${l.time}</small></span><span>${completed.has(keyFor(l.moduleIndex,l.lessonIndex))?"✓": "→"}</span></button>`).join(""):`<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>`;};paint();document.getElementById("lessonSearch").addEventListener("input",e=>paint(e.target.value));}
function openLesson(mi,li){current={module:mi,lesson:li,view:"lesson"};render();}
function renderLesson(main){const m=lessons[current.module],l=m.items[current.lesson],k=keyFor(current.module,current.lesson),done=completed.has(k),idx=all.findIndex(x=>x.moduleIndex===current.module&&x.lessonIndex===current.lesson);main.innerHTML=`<div class="crumb">Курс / ${m.module} / Урок ${idx+1} из ${all.length}</div><div class="section-title" style="margin-top:0"><div><div class="eyebrow">${m.module.toUpperCase()}</div><h2 style="margin-top:7px">${l.title}</h2><p>${l.time} · ${l.level}</p></div><span class="tag">${done?"✓ Завершено":"В процессе"}</span></div><div class="lesson-layout"><section class="lesson-panel"><div class="panel-head"><strong>📘 Материал урока</strong><span class="tag">${current.lesson+1}/${m.items.length}</span></div><div class="panel-body lesson-body"><h2>${l.title}</h2>${l.body}<div class="quiz"><h3>Проверь себя</h3><p style="color:var(--text);font-size:13px">${l.question}</p><div id="answers">${l.answers.map((a,i)=>`<button class="answer" onclick="answerQuiz(${i},${l.correct},'${k}',this)">${String.fromCharCode(65+i)}. ${a}</button>`).join("")}</div><div class="feedback" id="quizFeedback">${passed.has(k)?"✓ Тест уже пройден. Можешь ответить ещё раз для закрепления.":""}</div></div><div class="lesson-nav"><button class="btn" ${idx===0?"disabled":""} onclick="prevLesson()">← Предыдущий</button><button class="btn primary" onclick="finishLesson('${k}')">${done?"Завершено ✓":"Отметить завершённым ✓"}</button><button class="btn" ${idx===all.length-1?"disabled":""} onclick="nextLesson()">Следующий →</button></div><div class="notice">Подсказка: попробуй изменить код в редакторе и запусти его.</div></div></section><section class="editor-panel"><div class="panel-head"><strong>⌘ Практика кода</strong><span class="tag">Python</span></div><div class="editor-toolbar"><span>main.py</span><div class="editor-actions"><button class="btn ghost" onclick="resetCode()">Сбросить</button><button class="btn primary" onclick="runCode()">▶ Запустить</button></div></div><textarea class="editor" id="codeEditor" spellcheck="false" aria-label="Редактор Python">${escapeHtml(l.code)}</textarea><div class="output-label"><span>ВЫВОД</span><button class="btn ghost" style="padding:3px 7px" onclick="clearOutput()">Очистить</button></div><div class="output" id="output">Нажми «Запустить», чтобы выполнить код.</div><div class="notice" style="padding:0 14px 14px">Запуск использует Python в браузере (Pyodide). Для первой загрузки нужен интернет. Часть системных функций и ввод/файлы ограничены средой браузера.</div></section></div><div class="footer"><span>Урок ${idx+1} из ${all.length}</span><span>${completed.size} завершено · ${Math.round(completed.size/all.length*100)}% курса</span></div>`;}
function escapeHtml(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function answerQuiz(i,correct,k,btn){const buttons=[...document.querySelectorAll("#answers .answer")];buttons.forEach(b=>b.disabled=true);if(i===correct){btn.classList.add("correct");document.getElementById("quizFeedback").textContent="Верно! "+lessons[current.module].items[current.lesson].explain;passed.add(k);localStorage.setItem("pypath_passed",JSON.stringify([...passed]));updateProgress();}else{btn.classList.add("wrong");buttons[correct].classList.add("correct");document.getElementById("quizFeedback").textContent="Не совсем. "+lessons[current.module].items[current.lesson].explain;}}
function finishLesson(k){completed.add(k);saveProgress();toast("Урок отмечен как завершённый");render();}
function nextLesson(){let i=all.findIndex(x=>x.moduleIndex===current.module&&x.lessonIndex===current.lesson);if(i<all.length-1){let n=all[i+1];openLesson(n.moduleIndex,n.lessonIndex);}}
function prevLesson(){let i=all.findIndex(x=>x.moduleIndex===current.module&&x.lessonIndex===current.lesson);if(i>0){let n=all[i-1];openLesson(n.moduleIndex,n.lessonIndex);}}
function resetCode(){const l=lessons[current.module].items[current.lesson];document.getElementById("codeEditor").value=l.code;document.getElementById("output").textContent="Код восстановлен.";document.getElementById("output").classList.remove("error");}
function clearOutput(){document.getElementById("output").textContent="";document.getElementById("output").classList.remove("error");}
let pyodidePromise=null;
async function getPyodide(){if(!pyodidePromise){pyodidePromise=new Promise((resolve,reject)=>{if(window.loadPyodide){window.loadPyodide().then(resolve).catch(reject);return;}let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";s.onload=()=>window.loadPyodide().then(resolve).catch(reject);s.onerror=()=>reject(new Error("Не удалось загрузить Python. Проверь подключение к интернету."));document.head.appendChild(s);});}return pyodidePromise;}
async function runCode(){const output=document.getElementById("output"),code=document.getElementById("codeEditor").value;output.classList.remove("error");output.textContent="Загружаем Python…";try{const py=await getPyodide();let textOut="",textErr="";py.setStdout({batched:s=>textOut+=s+"\n"});py.setStderr({batched:s=>textErr+=s+"\n"});await py.runPythonAsync(code);output.textContent=(textOut+textErr).trim()||"Код выполнен без вывода.";if(textErr)output.classList.add("error");}catch(e){output.textContent=String(e).replace(/^PythonError:\s*/,"");output.classList.add("error");}}
function renderPractice(main){main.innerHTML=`<div class="crumb">Обучение / Практика</div><section class="hero"><div class="eyebrow">ТРЕНАЖЁР</div><h1>Пиши код. Проверяй идеи.</h1><p>Выбери задачу, напиши решение в редакторе и запусти настоящий Python в браузере.</p><div class="hero-meta"><span class="tag">Pyodide</span><span class="tag">Без установки Python</span></div></section><div class="section-title"><div><h2>Практические задания</h2><p>Задачи на ключевые темы курса.</p></div></div><div class="module-grid">${practiceTasks.map((t,i)=>`<div class="module" onclick="loadPractice(${i})"><div class="module-top"><div class="module-icon">${t.icon}</div><span class="tag">${t.level}</span></div><h3>${t.title}</h3><p>${t.desc}</p><div class="module-foot"><span>Открыть задачу</span><span>→</span></div></div>`).join("")}</div><div id="practiceEditor" style="margin-top:22px"></div>`;}
const practiceTasks=[
{icon:"🔢",level:"Легко",title:"Сумма чисел",desc:"Посчитай сумму чисел от 1 до N.",task:"Напиши программу, которая считает сумму чисел от 1 до 100 включительно.",code:"total = 0\nfor number in range(1, 101):\n    total += number\nprint(total)"},
{icon:"🔤",level:"Легко",title:"Счётчик гласных",desc:"Пройди по строке и посчитай гласные.",task:"Посчитай количество английских гласных в строке text без учёта регистра.",code:'text = "Python is awesome"\nvowels = "aeiou"\ncount = 0\nfor char in text.lower():\n    if char in vowels:\n        count += 1\nprint(count)'},
{icon:"🧠",level:"Средне",title:"Палиндром",desc:"Проверь, читается ли строка одинаково в обе стороны.",task:"Создай функцию is_palindrome(text), которая возвращает True, если строка — палиндром без учёта регистра и пробелов.",code:'def is_palindrome(text):\n    text = text.lower().replace(" ", "")\n    return text == text[::-1]\n\nprint(is_palindrome("топот"))\nprint(is_palindrome("python"))'},
{icon:"📊",level:"Средне",title:"Частота слов",desc:"Подсчитай, сколько раз встречается каждое слово.",task:"Создай словарь с частотой каждого слова в предложении sentence.",code:'sentence = "python учить python интересно"\nfrequency = {}\nfor word in sentence.split():\n    frequency[word] = frequency.get(word, 0) + 1\nprint(frequency)'}];
function loadPractice(i){const t=practiceTasks[i],el=document.getElementById("practiceEditor");el.innerHTML=`<div class="lesson-layout"><section class="lesson-panel"><div class="panel-head"><strong>${t.icon} ${t.title}</strong><span class="tag">${t.level}</span></div><div class="panel-body"><h3>Задание</h3><p>${t.task}</p><div class="callout">Попробуй сначала написать решение самостоятельно. Если застрял — изучи пример, затем измени его.</div><button class="btn" onclick="loadPracticeExample(${i})">Показать пример решения</button></div></section><section class="editor-panel"><div class="editor-toolbar"><span>practice.py</span><button class="btn primary" onclick="runPractice()">▶ Запустить</button></div><textarea id="practiceCode" class="editor" style="min-height:240px">${escapeHtml("# Напиши своё решение здесь")}</textarea><div class="output-label">ВЫВОД</div><div class="output" id="practiceOutput">Готов к запуску.</div></section></div>`;el.scrollIntoView({behavior:"smooth",block:"start"});}
function loadPracticeExample(i){document.getElementById("practiceCode").value=practiceTasks[i].code;}
async function runPractice(){let out=document.getElementById("practiceOutput"),code=document.getElementById("practiceCode").value;out.classList.remove("error");out.textContent="Загружаем Python…";try{let py=await getPyodide(),result="";py.setStdout({batched:s=>result+=s+"\n"});py.setStderr({batched:s=>result+=s+"\n"});await py.runPythonAsync(code);out.textContent=result.trim()||"Код выполнен без вывода.";}catch(e){out.textContent=String(e).replace(/^PythonError:\s*/,"");out.classList.add("error");}}
function renderCertificate(main){const pct=Math.round(completed.size/all.length*100),eligible=completed.size===all.length;main.innerHTML=`<div class="crumb">Обучение / Сертификат</div><div class="certificate"><div class="big">${eligible?"🏆":"🎓"}</div><div class="eyebrow">PYPATH · PYTHON COURSE</div><h2>${eligible?"Курс завершён!":"Твой будущий сертификат"}</h2><p style="color:var(--muted);max-width:530px;margin:0 auto 20px">${eligible?"Поздравляем! Ты завершил все уроки курса. Сертификат можно распечатать или сохранить в PDF.":"Заверши все уроки курса, чтобы открыть сертификат. Продолжай учиться — каждый небольшой шаг приближает к цели."}</p><div style="font-size:38px;font-weight:800">${pct}%</div><div style="height:8px;background:#303846;border-radius:8px;max-width:400px;margin:12px auto 25px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--green)"></div></div><p>${completed.size} из ${all.length} уроков завершено</p><button class="btn primary" onclick="goView('all')">Продолжить обучение</button> ${eligible?'<button class="btn" onclick="window.print()">Печать сертификата</button>':""}</div><div class="section-title"><div><h2>Как получить сертификат</h2><p>Пройди все уроки, включая итоговый проект.</p></div></div><div class="callout">Это учебный сертификат самой платформы, а не официальный документ об образовании. Он отражает только прогресс, сохранённый в текущем браузере.</div>`;}
function toast(msg){const old=document.querySelector(".toast");if(old)old.remove();let d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2300);}
document.querySelectorAll(".navitem[data-view]").forEach(b=>b.addEventListener("click",()=>goView(b.dataset.view)));
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
loadProgress();render();
</script>
</body>
