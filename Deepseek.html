<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — бесплатный курс Python</title>
<style>
:root{
  --bg:#0a0e14; --bg2:#0f151d; --bg3:#161e29; --border:#22303f;
  --text:#e6edf3; --muted:#8b98a5; --accent:#3fb950; --accent-dim:#2ea043;
  --accent2:#58a6ff; --danger:#f85149; --warn:#d29922;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243040;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#31435a}

/* ---------- HEADER ---------- */
header{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:200;
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:rgba(10,14,20,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.logo .mark{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(135deg,var(--accent),#1f6feb);color:#04140a;
}
.menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:17px;align-items:center;justify-content:center}
.spacer{flex:1}
.progress-wrap{display:flex;align-items:center;gap:10px;min-width:150px}
.progress-bar{width:130px;height:7px;background:var(--bg3);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#2f81f7);transition:width .35s ease;border-radius:99px}
.progress-text{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{
  font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);
  color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
.dot.ok{background:var(--accent);animation:none}
.dot.err{background:var(--danger);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- LAYOUT ---------- */
.layout{display:flex;padding-top:56px;min-height:100vh}
aside{
  position:fixed;top:56px;left:0;bottom:0;width:300px;overflow-y:auto;
  border-right:1px solid var(--border);background:var(--bg2);padding:14px 0 40px;z-index:150;
}
main{flex:1;margin-left:300px;padding:30px 34px 80px;min-width:0}
.content{max-width:880px;margin:0 auto}

/* ---------- SIDEBAR ---------- */
.side-title{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
  padding:10px 18px 6px;font-weight:700}
.module{border-bottom:1px solid rgba(34,48,63,.6)}
.module-head{
  display:flex;align-items:center;gap:9px;padding:11px 18px;cursor:pointer;
  font-weight:600;font-size:13.5px;user-select:none;transition:background .15s;
}
.module-head:hover{background:var(--bg3)}
.module-head .ic{font-size:15px}
.module-head .chev{margin-left:auto;color:var(--muted);font-size:10px;transition:transform .2s}
.module.open .chev{transform:rotate(90deg)}
.module-body{display:none;padding-bottom:6px}
.module.open .module-body{display:block}
.lesson-link{
  display:flex;align-items:flex-start;gap:9px;padding:7px 18px 7px 34px;cursor:pointer;
  font-size:13px;color:#b6c2cf;transition:background .12s,color .12s;border-left:2px solid transparent;
}
.lesson-link:hover{background:var(--bg3);color:#fff}
.lesson-link.active{background:rgba(63,185,80,.09);color:#fff;border-left-color:var(--accent);font-weight:600}
.lesson-link .chk{
  flex:0 0 15px;width:15px;height:15px;margin-top:3px;border-radius:50%;
  border:1.5px solid #3a4a5c;display:grid;place-items:center;font-size:9px;color:transparent;
}
.lesson-link.done .chk{background:var(--accent);border-color:var(--accent);color:#04140a}
.lesson-link.done{color:#7d8b99}

/* ---------- CONTENT ---------- */
.crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}
h1.title{font-size:29px;line-height:1.25;letter-spacing:-.5px;margin-bottom:22px;font-weight:800}
.theory{font-size:15px;color:#c9d5e0}
.theory h3{font-size:16.5px;color:#fff;margin:22px 0 8px;font-weight:700}
.theory h3:first-child{margin-top:0}
.theory p{margin:9px 0}
.theory ul,.theory ol{margin:9px 0 9px 22px}
.theory li{margin:4px 0}
.theory code{
  background:#1b2430;padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',Consolas,monospace;
  font-size:13px;color:#79c0ff;
}
.theory pre{
  background:#0d1117;border:1px solid var(--border);border-radius:9px;padding:13px 15px;
  overflow-x:auto;margin:11px 0;
}
.theory pre code{background:none;padding:0;color:#c9d1d9;font-size:13px;line-height:1.65}
.theory strong{color:#fff}

.task-box{
  margin:24px 0 18px;padding:16px 18px;border-radius:11px;
  background:linear-gradient(180deg,rgba(63,185,80,.08),rgba(63,185,80,.03));
  border:1px solid rgba(63,185,80,.3);
}
.task-box .lbl{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);
  font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.task-box .txt{font-size:14.5px;color:#d6e2ee}
.task-box code{background:#1b2430;padding:2px 6px;border-radius:5px;font-family:monospace;font-size:13px;color:#79c0ff}

.editor-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;
}
.editor-bar .tab{
  font-size:12px;color:var(--muted);font-family:monospace;padding:5px 12px;
  background:var(--bg3);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;
  margin-bottom:-8px;position:relative;top:1px;color:#c9d5e0;
}
.editor{
  display:flex;background:#0d1117;border:1px solid var(--border);border-radius:0 10px 10px 10px;
  overflow:hidden;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:13.5px;line-height:1.62;
  height:250px;
}
.gutter{
  padding:13px 10px 13px 14px;text-align:right;color:#3d4a5a;user-select:none;
  background:#0d1117;border-right:1px solid #1c2531;overflow:hidden;white-space:pre;
  font-variant-numeric:tabular-nums;min-width:44px;
}
#editor{
  flex:1;background:transparent;border:none;outline:none;color:#e6edf3;padding:13px 14px;
  resize:none;font-family:inherit;font-size:inherit;line-height:inherit;white-space:pre;
  overflow:auto;tab-size:4;
}
#editor::selection{background:rgba(88,166,255,.3)}

.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button.btn{
  font-family:inherit;font-size:13.5px;font-weight:650;padding:9px 18px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;gap:7px;
}
button.btn:hover:not(:disabled){background:#22303f;border-color:#33455a}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#04140a}
button.btn.primary:hover:not(:disabled){background:#4ac95c;border-color:#4ac95c}
button.btn.ghost{background:transparent}
button.btn.blue{background:rgba(88,166,255,.13);border-color:rgba(88,166,255,.4);color:#79c0ff}
button.btn.blue:hover:not(:disabled){background:rgba(88,166,255,.22)}

.console{
  margin-top:14px;border-radius:10px;border:1px solid var(--border);background:#0d1117;
  overflow:hidden;display:none;
}
.console.show{display:block}
.console-head{
  padding:7px 14px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
  background:var(--bg3);border-bottom:1px solid var(--border);color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;
}
.console-body{
  padding:13px 15px;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;
  white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;color:#c9d1d9;
}
.console-body .err{color:#ff9d95}
.console-body .ok{color:#7ee787}
.console-body .empty{color:#4d5a68;font-style:italic}
.console.ok{border-color:rgba(63,185,80,.5)}
.console.ok .console-head{background:rgba(63,185,80,.13);color:#7ee787}
.console.fail{border-color:rgba(248,81,73,.5)}
.console.fail .console-head{background:rgba(248,81,73,.12);color:#ff9d95}

.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:38px;
  padding-top:22px;border-top:1px solid var(--border)}
.navbtns .btn{flex:0 1 auto}

/* ---------- MODAL ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(3,6,10,.82);backdrop-filter:blur(6px);
  display:none;place-items:center;z-index:500;padding:20px;
}
.overlay.show{display:grid}
.modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:34px;
  max-width:460px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);
}
.modal h2{font-size:23px;margin-bottom:10px;letter-spacing:-.3px}
.modal p{color:var(--muted);font-size:14px;margin-bottom:20px}
.modal input{
  width:100%;padding:12px 15px;border-radius:10px;border:1px solid var(--border);
  background:#0d1117;color:var(--text);font-size:15px;font-family:inherit;outline:none;margin-bottom:14px;
}
.modal input:focus{border-color:var(--accent)}
.cert{
  background:linear-gradient(160deg,#0f1a12,#0d1117);border:2px solid var(--accent);
  border-radius:16px;padding:30px 24px;margin-bottom:18px;
}
.cert .big{font-size:22px;font-weight:800;color:#7ee787;margin:6px 0}
.cert .nm{font-size:19px;font-weight:700;color:#fff;border-bottom:1px dashed #2ea043;
  display:inline-block;padding:0 14px 3px;margin:12px 0}
.cert small{color:var(--muted);font-size:11.5px;display:block;margin-top:14px;line-height:1.7}

/* ---------- RESPONSIVE ---------- */
@media (max-width:920px){
  aside{transform:translateX(-100%);transition:transform .25s ease;width:290px;box-shadow:8px 0 30px rgba(0,0,0,.5)}
  aside.open{transform:translateX(0)}
  main{margin-left:0;padding:22px 16px 70px}
  .menu-btn{display:flex}
  h1.title{font-size:23px}
  .progress-wrap{display:none}
  .editor{height:220px}
  .navbtns .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="logo"><span class="mark">🐍</span> PyCamp</div>
  <div class="spacer"></div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 43</div>
  </div>
  <div class="pill" id="pyStatus"><span class="dot"></span><span>Python загружается…</span></div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main><div class="content" id="content"></div></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
/* =========================================================================
   КУРИКУЛУМ
   ========================================================================= */
const CURRICULUM = [
/* ======================= МОДУЛЬ 1 ======================= */
{
  id:"m1", title:"Введение в Python", icon:"🚀",
  lessons:[
  {
    id:"l1-1", title:"Первая программа: print()",
    theory:`
      <h3>Что такое Python?</h3>
      <p>Python — высокоуровневый язык программирования общего назначения. Его код читается почти как обычный текст, поэтому он идеально подходит для первого знакомства с программированием.</p>
      <p>Сегодня Python используют для веб-разработки, анализа данных, машинного обучения, автоматизации и научных расчётов.</p>
      <h3>Функция print()</h3>
      <p><code>print()</code> — встроенная функция, которая выводит значение на экран.</p>
      <pre><code>print("Привет, мир!")
print(42)
print(3.14)</code></pre>
      <p>Текст (строку) нужно заключать в кавычки — одинарные или двойные, разницы нет:</p>
      <pre><code>print('Одинарные кавычки тоже работают')</code></pre>
      <p>Обратите внимание: имя функции пишется строчными буквами, а после него идут круглые скобки.</p>
    `,
    task:`Напишите программу, которая выводит на экран ровно одну строку:<br><code>Привет, мир!</code>`,
    starter:`# Напишите ваш код ниже\n`,
    tests:`assert _output.strip() == "Привет, мир!", "Ожидался вывод: Привет, мир!  А получено: " + repr(_output.strip())`,
    solution:`print("Привет, мир!")`
  },
  {
    id:"l1-2", title:"Комментарии и структура кода",
    theory:`
      <h3>Комментарии</h3>
      <p>Комментарии — это заметки в коде, которые Python полностью игнорирует при выполнении. Они начинаются с символа <code>#</code> и действуют до конца строки.</p>
      <pre><code># Это комментарий, он не выполняется
print("Это код")   # комментарий можно писать и после кода</code></pre>
      <p>Зачем они нужны? Чтобы объяснить <strong>почему</strong> код делает то, что делает. Хороший код читается, но не всегда очевиден.</p>
      <h3>Отступы</h3>
      <p>В Python отступы — часть синтаксиса, а не украшение. Они определяют блоки кода (в условиях, циклах, функциях). Пока мы пишем линейные программы, отступы не нужны, но вскоре они станут обязательными. Стандарт — <strong>4 пробела</strong>.</p>
      <h3>Регистрозависимость</h3>
      <p>Python различает регистр: <code>Print</code>, <code>PRINT</code> и <code>print</code> — три разных имени.</p>
    `,
    task:`Напишите программу, которая выводит две строки:<br><code>Python</code><br><code>это легко</code><br><br>Добавьте в код хотя бы один комментарий.`,
    starter:`# Ваш код здесь\n`,
    tests:`_lines = [l for l in _output.split("\\n") if l.strip()]\nassert _lines == ["Python", "это легко"], "Ожидались строки ['Python', 'это легко'], а получено: " + repr(_lines)`,
    solution:`# Моя вторая программа на Python
print("Python")
print("это легко")`
  },
  {
    id:"l1-3", title:"Переменные",
    theory:`
      <h3>Что такое переменная?</h3>
      <p>Переменная — это имя, за которым хранится значение. Создать переменную в Python очень просто: нужно присвоить ей значение оператором <code>=</code>.</p>
      <pre><code>name = "Ада"
age = 36
height = 1.65</code></pre>
      <p>Знак <code>=</code> здесь не «равно», а «присвоить». Читается так: «переменной <code>name</code> присвоить строку Ада».</p>
      <h3>Правила именования</h3>
      <ul>
        <li>Имя может содержать буквы, цифры и подчёркивание <code>_</code>.</li>
        <li>Имя <strong>не может</strong> начинаться с цифры.</li>
        <li>Пробелы запрещены — используйте <code>snake_case</code>: <code>user_name</code>.</li>
        <li>Регистр важен: <code>age</code> и <code>Age</code> — разные переменные.</li>
        <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т. д.).</li>
      </ul>
      <h3>Значение можно менять</h3>
      <pre><code>x = 10
x = x + 5      # теперь x равно 15
x += 1         # краткая запись: x = x + 1</code></pre>
      <p>Python — язык с динамической типизацией: одна и та же переменная может сначала хранить число, а потом строку.</p>
    `,
    task:`Создайте три переменные:<br>
      • <code>language</code> со значением <code>"Python"</code><br>
      • <code>year</code> со значением <code>1991</code><br>
      • <code>author</code> со значением <code>"Гвидо ван Россум"</code><br><br>
      Затем выведите каждую из них с помощью <code>print()</code>.`,
    starter:`# Создайте переменные и выведите их\n`,
    tests:`assert language == "Python", "Переменная language должна быть равна 'Python'"\nassert year == 1991, "Переменная year должна быть равна 1991"\nassert author == "Гвидо ван Россум", "Переменная author должна быть равна 'Гвидо ван Россум'"\nassert "Python" in _output, "Не забудьте вывести переменные через print()"`,
    solution:`language = "Python"
year = 1991
author = "Гвидо ван Россум"

print(language)
print(year)
print(author)`
  },
  {
    id:"l1-4", title:"Типы данных и type()",
    theory:`
      <h3>Базовые типы</h3>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>1000000</code></li>
        <li><code>float</code> — числа с плавающей точкой: <code>3.14</code>, <code>-0.5</code>, <code>2.0</code></li>
        <li><code>str</code> — строки: <code>"привет"</code>, <code>'42'</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code> (обязательно с большой буквы)</li>
        <li><code>NoneType</code> — особое значение <code>None</code>, означает «ничего»</li>
      </ul>
      <h3>Функция type()</h3>
      <p><code>type(x)</code> возвращает тип значения:</p>
      <pre><code>print(type(42))      # &lt;class 'int'&gt;
print(type(3.14))    # &lt;class 'float'&gt;
print(type("текст")) # &lt;class 'str'&gt;
print(type(True))    # &lt;class 'bool'&gt;</code></pre>
      <p>Важно: <code>42</code> и <code>"42"</code> — это разные вещи! Первое — число, второе — строка из двух символов.</p>
    `,
    task:`Создайте четыре переменные:<br>
      • <code>number</code> = <code>10</code><br>
      • <code>pi</code> = <code>3.14</code><br>
      • <code>word</code> = <code>"код"</code><br>
      • <code>flag</code> = <code>True</code><br><br>
      Затем выведите тип каждой переменной с помощью <code>type()</code>.`,
    starter:`number = 10
# Создайте остальные переменные и выведите их типы
`,
    tests:`assert isinstance(number, int) and number == 10, "number должно быть целым числом 10"\nassert isinstance(pi, float) and pi == 3.14, "pi должно быть числом с плавающей точкой 3.14"\nassert isinstance(word, str) and word == "код", "word должно быть строкой 'код'"\nassert flag is True, "flag должно быть True (с большой буквы)"\nassert "<class 'int'>" in _output, "Выведите тип каждой переменной через print(type(...))"`,
    solution:`number = 10
pi = 3.14
word = "код"
flag = True

print(type(number))
print(type(pi))
print(type(word))
print(type(flag))`
  }
  ]
},

/* ======================= МОДУЛЬ 2 ======================= */
{
  id:"m2", title:"Числа и строки", icon:"🔢",
  lessons:[
  {
    id:"l2-1", title:"Арифметические операторы",
    theory:`
      <h3>Основные операторы</h3>
      <ul>
        <li><code>+</code> — сложение</li>
        <li><code>-</code> — вычитание</li>
        <li><code>*</code> — умножение</li>
        <li><code>/</code> — деление (всегда даёт <code>float</code>)</li>
        <li><code>//</code> — целочисленное деление (отбрасывает дробную часть)</li>
        <li><code>%</code> — остаток от деления</li>
        <li><code>**</code> — возведение в степень</li>

    id:"l4-1", title:"Цикл while",
    theory:`
      <h3>Что такое цикл</h3>
      <p>Цикл повторяет блок кода, пока условие истинно.</p>
      <pre><code>i = 1
while i <= 5:
    print(i)
    i += 1</code></pre>
      <p>Вывод: <code>1 2 3 4 5</code>.</p>
      <h3>Три обязательных части</h3>
      <ol>
        <li><strong>Инициализация</strong> — <code>i = 1</code> до цикла</li>
        <li><strong>Условие</strong> — <code>i &lt;= 5</code></li>
        <li><strong>Изменение</strong> — <code>i += 1</code> внутри тела</li>
      </ol>
      <p>Если забыть третью часть, условие никогда не станет ложным — получится <strong>бесконечный цикл</strong>. В браузере он просто «зависнет».</p>
      <h3>Сокращённые операторы</h3>
      <pre><code>x += 1   # x = x + 1
x -= 2   # x = x - 2
x *= 3   # x = x * 3
x //= 2  # x = x // 2</code></pre>
      <h3>Когда использовать while</h3>

          <td style="padding:8px;border:1px solid #22303f"><code>cls</code></td>
          <td style="padding:8px;border:1px solid #22303f">классу</td>

          <td style="padding:8px;border:1px solid #22303f">ни к чему</td>

      </table>
      <h3>@classmethod — альтернативные конструкторы</h3>
      <pre><code>class Temperature:
    def __init__(self, celsius):
        self.celsius = celsius

    @classmethod
    def from_fahrenheit(cls, f):
        return cls((f - 32) * 5 / 9)

t = Temperature.from_fahrenheit(32)
print(t.celsius)   # 0.0</code></pre>
      <h3>@staticmethod — утилиты внутри класса</h3>

    @staticmethod
    def c_to_f(c):
        return c * 9 / 5 + 32

      <h3>Когда что использовать</h3>

      </ul>

      <h3>Генератор вычисляет по требованию</h3>
      <pre><code>def countdown(n):
    while n > 0:

      <p><code>yield</code> «приостанавливает» функцию, возвращая значение. При следующем запросе выполнение продолжается с того же места.</p>
      <h3>Свойства генераторов</h3>
      <ul>
        <li>Не хранят все значения в памяти — экономны</li>
        <li>Одноразовые: пройти можно только один раз</li>
        <li>Ленивые: код не выполняется, пока не начнётся перебор</li>
      </ul>
      <pre><code>g = countdown(3)

print(next(g))   # 2

      <h3>Генераторные выражения</h3>

        return self.tasks.pop(task, None) is not None

    def complete(self, task):
        if task in self.tasks:
            self.tasks[task] = True
            return True
        return False

    def list_all(self):
        return list(self.tasks.keys())

    def list_pending(self):
        return [t for t, done in self.tasks.items() if not done]

    def list_done(self):
        return [t for t, done in self.tasks.items() if done]`
  }
  ]
}
];

/* =========================================================================
   СОСТОЯНИЕ
   ========================================================================= */
const FLAT = [];
CURRICULUM.forEach((m, mi) => m.lessons.forEach((l, li) =>
  FLAT.push({ lesson: l, module: m, mi, li })
));
const TOTAL = FLAT.length;
const STORE_DONE = "pycamp_done_v1";
const STORE_CODE = "pycamp_code_v1";
const STORE_NAME = "pycamp_name_v1";

let completed = new Set();
try { completed = new Set(JSON.parse(localStorage.getItem(STORE_DONE) || "[]")); } catch (e) {}
let savedCode = {};
try { savedCode = JSON.parse(localStorage.getItem(STORE_CODE) || "{}"); } catch (e) {}

let currentId = FLAT[0].lesson.id;
let running = false;

function persistDone() {
  localStorage.setItem(STORE_DONE, JSON.stringify([...completed]));
}
function persistCode() {
  localStorage.setItem(STORE_CODE, JSON.stringify(savedCode));
}

/* =========================================================================
   PYODIDE
   ========================================================================= */
let pyodideInstance = null;
let pyodidePromise = null;

function setPyStatus(state, text) {
  const el = document.getElementById("pyStatus");
  const dot = el.querySelector(".dot");
  el.querySelector("span:last-child").textContent = text;
  dot.className = "dot" + (state === "ok" ? " ok" : state === "err" ? " err" : "");
}

function getPyodide() {
  if (!pyodidePromise) {
    pyodidePromise = loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
    }).then(py => {
      pyodideInstance = py;
      setPyStatus("ok", "Python готов");
      return py;
    }).catch(err => {
      setPyStatus("err", "Ошибка загрузки");
      throw err;
    });
  }
  return pyodidePromise;
}

const HARNESS = `
import io, sys, json, traceback

_ns = {'__name__': '__main__'}
_buf = io.StringIO()
_old = sys.stdout
sys.stdout = _buf
_err = None
try:
    exec(compile(_USER_SRC, '<ваш код>', 'exec'), _ns)
except BaseException:
    _err = traceback.format_exc(limit=2)
finally:
    sys.stdout = _old
_output = _buf.getvalue()
_ns['_output'] = _output

_t_err = None
_test_out = ''
if _err is None and _TESTS_SRC.strip():
    _b2 = io.StringIO()
    _old = sys.stdout
    sys.stdout = _b2
    try:
        exec(compile(_TESTS_SRC, '<тесты>', 'exec'), _ns)
    except BaseException:
        _t_err = traceback.format_exc(limit=2)
    finally:
        sys.stdout = _old
    _test_out = _b2.getvalue()

json.dumps({'output': _output, 'error': _err, 'testError': _t_err, 'testOutput': _test_out})
`;

async function executeCode(code, tests) {
  const py = await getPyodide();
  py.globals.set("_USER_SRC", code);
  py.globals.set("_TESTS_SRC", tests || "");
  const raw = py.runPython(HARNESS);
  return JSON.parse(raw);
}

/* =========================================================================
   РЕНДЕР САЙДБАРА
   ========================================================================= */
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  let html = '<div class="side-title">Учебная программа</div>';
  let counter = 0;
  CURRICULUM.forEach((m, mi) => {
    const doneInModule = m.lessons.filter(l => completed.has(l.id)).length;
    const isOpen = m.lessons.some(l => l.id === currentId) || mi === 0;
    html += `<div class="module ${isOpen ? "open" : ""}" data-mi="${mi}">
      <div class="module-head">
        <span class="ic">${m.icon}</span>
        <span>${m.title}</span>
        <span style="color:#5b6b7c;font-weight:500;font-size:11.5px">${doneInModule}/${m.lessons.length}</span>
        <span class="chev">▶</span>
      </div>
      <div class="module-body">`;
    m.lessons.forEach(l => {
      counter++;
      const done = completed.has(l.id);
      const active = l.id === currentId;
      html += `<div class="lesson-link ${done ? "done" : ""} ${active ? "active" : ""}" data-lid="${l.id}">
        <span class="chk">✓</span><span>${counter}. ${l.title}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  sb.innerHTML = html;

  sb.querySelectorAll(".module-head").forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle("open");
  });
  sb.querySelectorAll(".lesson-link").forEach(a => {
    a.onclick = () => {
      openLesson(a.dataset.lid);
      if (window.innerWidth <= 920) sb.classList.remove("open");
    };
  });

  const pct = TOTAL ? (completed.size / TOTAL) * 100 : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${completed.size} / ${TOTAL}`;
}

/* =========================================================================
   РЕНДЕР УРОКА
   ========================================================================= */
function findIndex(id) { return FLAT.findIndex(x => x.lesson.id === id); }

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function openLesson(id) {
  currentId = id;
  const idx = findIndex(id);
  const item = FLAT[idx];
  const lesson = item.lesson;
  const total = TOTAL;

  // сохраним текущий код перед переключением
  saveCurrentCode();

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="crumb">${item.module.icon} ${item.module.title} · Урок ${idx + 1} из ${total}</div>
    <h1 class="title">${lesson.title}</h1>
    <div class="theory">${lesson.theory}</div>
    <div class="task-box">
      <div class="lbl">🎯 Задание</div>
      <div class="txt">${lesson.task}</div>
    </div>
    <div class="editor-bar"><div class="tab">solution.py</div></div>
    <div class="editor">
      <div class="gutter" id="gutter">1</div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="actions">
      <button class="btn primary" id="runBtn">▶ Запустить</button>
      <button class="btn blue" id="checkBtn">✓ Проверить</button>
      <button class="btn ghost" id="solBtn">💡 Решение</button>
      <button class="btn ghost" id="resetBtn">↺ Сбросить код</button>
    </div>
    <div class="console" id="console">
      <div class="console-head"><span id="consoleTitle">Вывод</span><span id="consoleHint"></span></div>
      <div class="console-body" id="consoleBody"></div>
    </div>
    <div class="navbtns">
      <button class="btn" id="prevBtn" ${idx === 0 ? "disabled" : ""}>← Назад</button>
      <button class="btn" id="nextBtn" ${idx === total - 1 ? "disabled" : ""}>Далее →</button>
    </div>
  `;

  const ta = document.getElementById("editor");
  ta.value = savedCode[lesson.id] !== undefined ? savedCode[lesson.id] : lesson.starter;
  updateGutter();
  ta.addEventListener("input", () => { updateGutter(); saveCurrentCode(); });
  ta.addEventListener("scroll", () => {
    document.getElementById("gutter").scrollTop = ta.scrollTop;
  });
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = ta.selectionStart, epos = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(epos);
      ta.selectionStart = ta.selectionEnd = s + 4;
      updateGutter(); saveCurrentCode();
    }
  });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      runCode(false);
    }
  });

  document.getElementById("runBtn").onclick = () => runCode(false);
  document.getElementById("checkBtn").onclick = () => runCode(true);
  document.getElementById("solBtn").onclick = () => {
    if (confirm("Показать готовое решение? Ваш текущий код будет заменён.")) {
      ta.value = lesson.solution;
      updateGutter(); saveCurrentCode();
    }
  };
  document.getElementById("resetBtn").onclick = () => {
    if (confirm("Вернуть исходный шаблон кода?")) {
      ta.value = lesson.starter;
      updateGutter(); saveCurrentCode();
    }
  };
  document.getElementById("prevBtn").onclick = () => { if (idx > 0) openLesson(FLAT[idx - 1].lesson.id); };
  document.getElementById("nextBtn").onclick = () => { if (idx < total - 1) openLesson(FLAT[idx + 1].lesson.id); };

  renderSidebar();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateGutter() {
  const ta = document.getElementById("editor");
  const g = document.getElementById("gutter");
  if (!ta || !g) return;
  const n = ta.value.split("\n").length;
  let out = "";
  for (let i = 1; i <= n; i++) out += i + (i < n ? "\n" : "");
  g.textContent = out;
  g.scrollTop = ta.scrollTop;
}

function saveCurrentCode() {
  const ta = document.getElementById("editor");
  if (!ta || !currentId) return;
  savedCode[currentId] = ta.value;
  persistCode();
}

/* =========================================================================
   ВЫПОЛНЕНИЕ
   ========================================================================= */
function cleanTraceback(tb) {
  if (!tb) return "";
  return tb.trim();
}

function lastLine(tb) {
  const lines = tb.trim().split("\n");
  return lines[lines.length - 1] || "";
}

async function runCode(isCheck) {
  if (running) return;
  const ta = document.getElementById("editor");
  const code = ta.value;
  const item = FLAT[findIndex(currentId)];
  const lesson = item.lesson;

  const runBtn = document.getElementById("runBtn");
  const checkBtn = document.getElementById("checkBtn");
  const consoleEl = document.getElementById("console");
  const body = document.getElementById("consoleBody");
  const title = document.getElementById("consoleTitle");
  const hint = document.getElementById("consoleHint");

  running = true;
  runBtn.disabled = true; checkBtn.disabled = true;
  runBtn.textContent = "⏳ Выполняется…";

  consoleEl.classList.remove("ok", "fail");
  consoleEl.classList.add("show");
  title.textContent = isCheck ? "Проверка" : "Вывод программы";
  hint.textContent = "";
  body.innerHTML = '<span class="empty">Запуск Python…</span>';

  try {
    await getPyodide();
    const res = await executeCode(code, isCheck ? lesson.tests : "");

    let html = "";
    const out = (res.output || "").replace(/\s+$/, "");
    const tOut = (res.testOutput || "").replace(/\s+$/, "");

    if (out) {
      html += escapeHtml(out);
    } else if (!res.error) {
      html += '<span class="empty">— программа ничего не вывела —</span>';
    }

    if (res.error) {
      html += (out ? "\n\n" : "") + '<span class="err">' + escapeHtml(cleanTraceback(res.error)) + "</span>";
      consoleEl.classList.add("fail");
      title.textContent = "Ошибка выполнения";
      hint.textContent = "";
    } else if (isCheck) {
      if (res.testError) {
        html += (out ? "\n\n" : "") + '<span class="err">✗ ' +
                escapeHtml(lastLine(res.testError)) + "</span>";
        consoleEl.classList.add("fail");
        title.textContent = "Проверка не пройдена";
        hint.textContent = "";
      } else {
        if (tOut) html += (out ? "\n\n" : "") + escapeHtml(tOut);
        html += (html ? "\n\n" : "") + '<span class="ok">✓ Отлично! Все проверки пройдены.</span>';
        consoleEl.classList.add("ok");
        title.textContent = "Успех";
        hint.textContent = "";
        if (!completed.has(currentId)) {
          completed.add(currentId);
          persistDone();
          renderSidebar();
        }
        const idx = findIndex(currentId);
        if (completed.size === TOTAL) {
          setTimeout(showCertificateModal, 700);
        } else if (idx < TOTAL - 1) {
          hint.innerHTML = '<span style="color:#7ee787;text-transform:none;letter-spacing:0">Переход к следующему уроку…</span>';
          setTimeout(() => {
            if (currentId === lesson.id) openLesson(FLAT[idx + 1].lesson.id);
          }, 1300);
        }
      }
    }

    body.innerHTML = html || '<span class="empty">— нет вывода —</span>';
  } catch (err) {
    body.innerHTML = '<span class="err">Не удалось выполнить код: ' + escapeHtml(err.message || String(err)) + "</span>";
    consoleEl.classList.add("fail");
    title.textContent = "Ошибка";
  } finally {
    running = false;
    runBtn.disabled = false; checkBtn.disabled = false;
    runBtn.textContent = "▶ Запустить";
  }
}

   СЕРТИФИКАТ

function showCertificateModal() {
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  const savedName = localStorage.getItem(STORE_NAME) || "";
  modal.innerHTML = `
    <h2>🏆 Курс завершён!</h2>
    <p>Вы прошли все ${TOTAL} уроков курса Python. Введите имя для сертификата.</p>
    <input id="certName" type="text" placeholder="Ваше имя" value="${escapeHtml(savedName)}" maxlength="40">
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" id="certOk">Получить сертификат</button>
      <button class="btn ghost" id="certClose">Закрыть</button>
    </div>
  `;
  overlay.classList.add("show");
  document.getElementById("certClose").onclick = () => overlay.classList.remove("show");
  document.getElementById("certOk").onclick = () => {
    const nm = document.getElementById("certName").value.trim() || "Студент PyCamp";
    localStorage.setItem(STORE_NAME, nm);
    renderCertificate(nm);
  };
}

  const modal = document.getElementById("modal");
  const today = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  modal.innerHTML = `
    <div class="cert">
      <div style="font-size:34px">🐍</div>
      <div class="big">СЕРТИФИКАТ</div>
      <div style="color:#8b98a5;font-size:13px">подтверждает, что</div>
      <div class="nm">${escapeHtml(name)}</div>
      <div style="color:#c9d5e0;font-size:13.5px;margin-top:10px">
        успешно завершил(а) курс<br><strong style="color:#7ee787">Python с нуля до ООП</strong>
      </div>
      <small>PyCamp · ${TOTAL} уроков · ${today}<br>Введение · Типы данных · Логика · Циклы · Структуры данных · Функции · Файлы · ООП · Продвинутые темы</small>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" id="certClose2">Готово</button>
      <button class="btn ghost" id="certReset">Сбросить прогресс</button>
    </div>
  `;
  document.getElementById("certClose2").onclick = () => document.getElementById("overlay").classList.remove("show");
  document.getElementById("certReset").onclick = () => {
    if (confirm("Точно удалить весь прогресс и код? Это действие необратимо.")) {
      localStorage.removeItem(STORE_DONE);
      localStorage.removeItem(STORE_CODE);
      location.reload();
    }
  };
}

/* =========================================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================================= */
document.getElementById("menuBtn").onclick = () => {
  document.getElementById("sidebar").classList.toggle("open");
};

document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") e.target.classList.remove("show");
});

window.addEventListener("beforeunload", saveCurrentCode);

// Первый незавершённый урок
let startId = FLAT[0].lesson.id;
const firstUndone = FLAT.find(x => !completed.has(x.lesson.id));
if (firstUndone) startId = firstUndone.lesson.id;

openLesson(startId);

// Ленивая загрузка Python
setPyStatus("load", "Python загружается…");
getPyodide().catch(() => {});
</script>
