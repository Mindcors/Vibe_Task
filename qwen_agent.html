<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>freeCodeCamp — Интерактивный курс Python</title>
<meta name="description" content="Бесплатный интерактивный курс по Python: 41 урок, 7 модулей, реальное выполнение Python в браузере (Pyodide/WASM)." />
<style>
/* ====== CSS ТЕМЫ (как в Next.js-версии) ====== */
:root{
  --bg:#0a0a23; --bg2:#1b1b32; --bg3:#2a2a40;
  --panel:#ffffff; --panel2:#f5f6f7; --panel-border:#d0d7de;
  --text:#0a0a23; --muted:#5b6170;
  --accent:#2a72a5; --accent-fg:#ffffff;
  --green:#1a7f37; --green-bg:#dafbe1;
  --yellow:#f1be32; --yellow-fg:#0a0a23;
  --danger:#cf222e; --danger-bg:#ffebe9;
  --code-bg:#0d1117; --code-fg:#c9d1d9; --code-border:#30363d;
  --kw:#ff7b72; --str:#a5d6ff; --num:#79c0ff; --bi:#d2a8ff; --com:#8b949e;
  --shadow:0 6px 20px rgba(0,0,0,.18);
}
[data-theme="dark"]{
  --bg:#0a0a23; --bg2:#1b1b32; --bg3:#3b3b5c;
  --panel:#1b1b32; --panel2:#2a2a40; --panel-border:#3b3b5c;
  --text:#e6e6f0; --muted:#a3a3c2;
  --accent:#7ec8e3; --accent-fg:#0a0a23;
  --green:#7ee787; --green-bg:#0d2818;
  --yellow:#f1be32; --yellow-fg:#0a0a23;
  --danger:#ff7b72; --danger-bg:#3a1216;
  --code-bg:#0d1117; --code-fg:#c9d1d9; --code-border:#30363d;
  --kw:#ff7b72; --str:#a5d6ff; --num:#79c0ff; --bi:#d2a8ff; --com:#8b949e;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
.fcc-shell{display:flex;flex-direction:column;min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px;line-height:1.55}
.fcc-shell *,.fcc-shell *::before,.fcc-shell *::after{box-sizing:border-box}

/* header */
.fcc-header{background:var(--bg);color:#fff;border-bottom:3px solid var(--yellow);position:sticky;top:0;z-index:30}
.fcc-header-inner{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1600px;margin:0 auto}
.fcc-brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;text-decoration:none;color:#fff}
.fcc-flame{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 6px rgba(241,190,50,.5))}
.fcc-brand-text{font-weight:800;font-size:16.5px;line-height:1;letter-spacing:-.3px}
.fcc-brand-text small{display:block;font-weight:500;font-size:11px;color:#99c1e8;margin-top:2px;letter-spacing:.3px}
.fcc-header-spacer{flex:1}
.fcc-stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600}
.fcc-stat svg{width:16px;height:16px}
.fcc-icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;padding:6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.fcc-icon-btn:hover{background:rgba(255,255,255,.12)}
.fcc-icon-btn svg{width:20px;height:20px}
.fcc-donate{background:var(--yellow);color:var(--yellow-fg);border:none;font-weight:800;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:transform .1s,box-shadow .15s}
.fcc-donate:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(241,190,50,.4)}
.fcc-donate:active{transform:translateY(0)}

/* subbar */
.fcc-subbar{background:var(--bg2);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.fcc-subbar-inner{display:flex;align-items:center;gap:10px;padding:8px 16px;max-width:1600px;margin:0 auto;font-size:13px;flex-wrap:wrap;overflow:hidden}
.fcc-crumb{color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fcc-crumb b{color:#fff}
.fcc-progress-pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);padding:4px 10px 4px 8px;border-radius:999px;align-self:center}
.fcc-progress-pill .bar{width:140px;height:7px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.fcc-progress-pill .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#99e2a3);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fcc-progress-pill > span:first-child{color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.fcc-burger{display:none}

/* layout */
.fcc-body{flex:1;display:grid;grid-template-columns:300px 1fr;max-width:1600px;margin:0 auto;width:100%}

/* sidebar */
.fcc-sidebar{background:var(--bg2);color:#fff;border-right:1px solid rgba(255,255,255,.07);height:calc(100vh - 102px);position:sticky;top:102px;overflow:hidden;display:flex;flex-direction:column}
.fcc-drawer-head{display:none}
.fcc-side-search{padding:12px 12px;border-bottom:1px solid rgba(255,255,255,.07);position:relative}
.fcc-side-search svg.s-ico{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#8b949e;pointer-events:none}
.fcc-side-search input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:8px 10px 8px 32px;border-radius:8px;font-size:13px;outline:none;transition:border-color .15s,background .15s}
.fcc-side-search input:focus{border-color:var(--yellow);background:rgba(255,255,255,.09)}
.fcc-side-search input::placeholder{color:#8b949e}
.fcc-side-scroll{overflow-y:auto;flex:1;padding:4px 0 24px}
.fcc-side-scroll::-webkit-scrollbar{width:8px}
.fcc-side-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
.fcc-mod{padding:6px 4px}
.fcc-mod-title{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#99c1e8;cursor:pointer;border-radius:8px;line-height:1.25}
.fcc-mod-title:hover{background:rgba(255,255,255,.05)}
.fcc-mod-title .ico{font-size:15px;flex:none}
.fcc-mod-title .mtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fcc-mod-title .cnt{font-size:11px;color:#8b949e;font-weight:600;flex:none}
.fcc-mod-title .chev{transition:transform .2s;color:#8b949e;flex:none}
.fcc-mod.open .fcc-mod-title .chev{transform:rotate(90deg)}
.fcc-mod-progress{height:2px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:0 12px 4px}
.fcc-mod-progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#99e2a3);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fcc-lessons{display:none;padding:2px 0 6px}
.fcc-mod.open .fcc-lessons{display:block}
.fcc-lesson{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 30px;cursor:pointer;font-size:13.5px;color:#c9d1d9;border-left:2px solid transparent;transition:background .12s,color .12s}
.fcc-lesson:hover{background:rgba(255,255,255,.05);color:#fff}
.fcc-lesson.active{background:rgba(241,190,50,.18);color:#fff;border-left-color:var(--yellow);box-shadow:inset 3px 0 0 var(--yellow)}
.fcc-lesson .check{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:transparent;background:transparent;transition:all .2s}
.fcc-lesson.done .check{background:var(--green);border-color:var(--green);color:#0a0a23}
.fcc-lesson .num{font-size:11px;color:#8b949e;font-weight:600;width:18px;flex:none}
.fcc-lesson .ltitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcc-lesson .lm-bm{opacity:.85}
.fcc-lesson.capstone{background:linear-gradient(90deg,rgba(241,190,50,.08),transparent);border-radius:0 8px 8px 0;margin-right:4px}
.fcc-lesson.capstone .ltitle{font-weight:700}
.fcc-lesson.capstone.active{background:rgba(241,190,50,.18)}
.fcc-lesson .cap-ico{font-size:13px;flex:none;width:18px;text-align:center}
.fcc-mod.complete .fcc-mod-title{background:linear-gradient(90deg,rgba(126,231,135,.1),transparent)}
.fcc-mod.complete .fcc-mod-title .ico{filter:drop-shadow(0 0 4px rgba(126,231,135,.5))}
.fcc-mod-badge{position:absolute;top:6px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--green);display:none;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(126,231,135,.6);animation:fccpop .3s ease}
.fcc-mod.complete .fcc-mod-badge{display:flex}
.fcc-mod-badge svg{width:10px;height:10px;color:#0a0a23}
@keyframes fccpop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* main */
.fcc-main{padding:0;background:var(--panel);min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.fcc-lesson-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--panel-border);background:linear-gradient(180deg,var(--panel),var(--panel2))}
.fcc-lesson-head .lbadge{width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg2);color:#fff}
.fcc-lesson-head h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.fcc-lesson-head .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.fcc-lesson-head .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.fcc-lesson-head .xptag{margin-left:auto;background:var(--green-bg);color:var(--green);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;white-space:nowrap;align-self:center}

.fcc-grid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:1024px){.fcc-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.fcc-col{min-width:0;display:flex;flex-direction:column}

.fcc-meta-tags{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.fcc-meta-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.fcc-meta-tag.diff-easy{background:rgba(126,231,135,.12);color:var(--green);border-color:rgba(126,231,135,.25)}
.fcc-meta-tag.diff-mid{background:rgba(241,190,50,.12);color:var(--yellow);border-color:rgba(241,190,50,.25)}
.fcc-meta-tag.diff-hard{background:rgba(255,123,114,.12);color:var(--danger);border-color:rgba(255,123,114,.25)}
.fcc-meta-tag.time{background:rgba(126,200,227,.1);color:#7ec8e3;border-color:rgba(126,200,227,.2)}
.fcc-timer{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#7ec8e3;background:rgba(126,200,227,.1);border:1px solid rgba(126,200,227,.2);padding:2px 8px;border-radius:999px}
.fcc-timer svg{width:11px;height:11px}
.fcc-timer .t-num{font-variant-numeric:tabular-nums;min-width:32px}

/* instructions */
.fcc-instr{padding:20px 22px 20px;overflow-y:auto}
.fcc-instr h2{font-size:15px;margin:20px 0 10px;color:var(--text)}
.fcc-instr p{margin:0 0 14px;color:var(--text);line-height:1.65}
.fcc-instr p code{background:var(--bg3);color:#fff;padding:1px 6px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
[data-theme="light"] .fcc-instr p code{background:#eef0f3;color:#0a0a23}
.fcc-instr ul{margin:0 0 14px;padding-left:20px}
.fcc-instr li{margin:5px 0;line-height:1.6}
.fcc-instr .note{background:var(--green-bg);border-left:4px solid var(--green);padding:11px 16px;border-radius:8px;margin:0 0 16px;color:var(--text);font-size:13.5px;line-height:1.55}
.fcc-instr .example{background:var(--code-bg);color:var(--code-fg);border:1px solid var(--code-border);border-radius:10px;padding:14px 16px;margin:0 0 14px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6}
.fcc-instr .example .t-kw{color:var(--kw)} .fcc-instr .example .t-str{color:var(--str)} .fcc-instr .example .t-num{color:var(--num)} .fcc-instr .example .t-bi{color:var(--bi)} .fcc-instr .example .t-com{color:var(--com);font-style:italic}
.fcc-task{margin-top:14px;background:var(--panel2);border:1px solid var(--panel-border);border-radius:12px;padding:14px 16px}
.fcc-task h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.fcc-task ol{margin:0;padding-left:20px}
.fcc-task li{margin:5px 0;color:var(--text)}

/* tests panel */
.fcc-tests{padding:0 20px 8px}
.fcc-tests h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 8px}
.fcc-test{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13.5px;margin-bottom:4px;border:1px solid var(--panel-border);background:var(--panel)}
.fcc-test .dot{width:18px;height:18px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--muted);color:transparent}
.fcc-test.pass{background:var(--green-bg);border-color:var(--green)}
.fcc-test.pass .dot{background:var(--green);border-color:var(--green);color:#0a0a23}
.fcc-test.fail{background:var(--danger-bg);border-color:var(--danger)}
.fcc-test.fail .dot{background:var(--danger);border-color:var(--danger);color:#fff}
.fcc-test .label{flex:1}
.fcc-test .label code{font-family:ui-monospace,monospace;font-size:12px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
[data-theme="dark"] .fcc-test .label code{background:rgba(255,255,255,.1)}

/* lesson nav */
.fcc-lesson-nav{display:flex;gap:8px;padding:14px 20px;border-top:2px solid var(--panel-border);background:var(--panel2);align-items:center}
.fcc-lesson-nav .fcc-btn{background:var(--panel);border:1px solid var(--panel-border);color:var(--text)}
.fcc-lesson-nav .fcc-btn:hover{background:var(--bg3);color:#fff}
.fcc-lesson-nav .spacer{flex:1}

/* editor */
.fcc-editor-col{background:var(--code-bg);border-left:1px solid var(--code-border);min-height:320px}
@media(max-width:1023px){.fcc-editor-col{border-left:none;border-top:1px solid var(--code-border)}}
.fcc-editor-col.success{position:relative}
.fcc-editor-col.success::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 0 2px var(--green),inset 0 0 30px rgba(126,231,135,.15);animation:fccglow .6s ease}
@keyframes fccglow{0%{box-shadow:inset 0 0 0 0 var(--green),inset 0 0 0 rgba(126,231,135,0)}50%{box-shadow:inset 0 0 0 3px var(--green),inset 0 0 40px rgba(126,231,135,.3)}100%{box-shadow:inset 0 0 0 2px var(--green),inset 0 0 30px rgba(126,231,135,.15)}}
.fcc-editor-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#161b22;border-bottom:1px solid var(--code-border);flex-wrap:wrap}
.fcc-editor-bar .tabs{display:flex;gap:4px;align-items:center}
.fcc-tab{background:transparent;border:none;color:#8b949e;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:color .15s,background .15s,box-shadow .2s;position:relative}
.fcc-tab:hover{color:#c9d1d9}
.fcc-tab.active{background:var(--code-bg);color:#fff;box-shadow:inset 0 2px 0 0 var(--yellow)}
.fcc-tab:focus-visible{outline:2px solid var(--yellow);outline-offset:-2px}
.fcc-editor-bar .spacer{flex:1}
.fcc-btn{border:none;cursor:pointer;font-weight:700;font-size:13px;border-radius:8px;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;transition:transform .08s,opacity .15s}
.fcc-btn:active{transform:translateY(1px)}
.fcc-btn:disabled{opacity:.6;cursor:not-allowed}
.fcc-btn.run{background:var(--yellow);color:var(--yellow-fg);box-shadow:0 4px 14px rgba(241,190,50,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.fcc-btn.check{background:var(--green);color:#0a0a23;box-shadow:0 4px 14px rgba(126,231,135,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.fcc-btn.run:hover{filter:brightness(1.05);transform:translateY(-1px)}
.fcc-btn.check:hover{filter:brightness(1.05);transform:translateY(-1px)}
.fcc-btn.ghost{background:rgba(255,255,255,.06);color:#c9d1d9}
.fcc-btn.ghost:hover{background:rgba(255,255,255,.12)}
.fcc-btn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.fcc-editor{position:relative;background:var(--code-bg);display:flex;flex:1;min-height:240px}
.fcc-gutter{flex:none;width:46px;background:#0d1117;color:#6e7681;text-align:right;padding:14px 8px 14px 0;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;overflow:hidden;user-select:none;border-right:1px solid var(--code-border)}
.fcc-gutter .ln{height:calc(1.6em)}
.fcc-editor-area{position:relative;flex:1;overflow:hidden}
.fcc-hl,.fcc-ta{position:absolute;inset:0;margin:0;padding:16px 18px;border:none;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;white-space:pre;tab-size:4;-moz-tab-size:4;overflow:auto;background:transparent}
.fcc-hl{pointer-events:none;color:var(--code-fg);overflow:hidden;z-index:1}
.fcc-hl code{font:inherit;white-space:pre}
.fcc-ta{resize:none;outline:none;z-index:2;color:transparent;caret-color:var(--yellow);-webkit-text-fill-color:transparent}
.fcc-ta::selection{background:rgba(126,200,227,.3)}
.fcc-hl .t-kw{color:var(--kw)} .fcc-hl .t-str{color:var(--str)} .fcc-hl .t-num{color:var(--num)} .fcc-hl .t-bi{color:var(--bi)} .fcc-hl .t-com{color:var(--com);font-style:italic}

/* console */
.fcc-console{background:#010409;border-top:1px solid var(--code-border);min-height:140px;max-height:300px;overflow:auto;padding:0;scrollbar-width:thin;scrollbar-color:#30363d transparent}
.fcc-console::-webkit-scrollbar{width:10px;height:10px}
.fcc-console::-webkit-scrollbar-track{background:#010409}
.fcc-console::-webkit-scrollbar-thumb{background:#30363d;border-radius:8px;border:2px solid #010409}
.fcc-console::-webkit-scrollbar-thumb:hover{background:#484f58}
.fcc-console .cline{padding:5px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5;border-bottom:1px solid rgba(255,255,255,.04);white-space:pre-wrap;word-break:break-word}
.fcc-console .cline.info{color:#8b949e}
.fcc-console .cline.out{color:#c9d1d9}
.fcc-console .cline.err{color:#ff7b72}
.fcc-console .cline.ok{color:#7ee787}
.fcc-console .cline.sys{color:#79c0ff}
.fcc-console .prompt{color:#7ee787;font-weight:700}
.fcc-console-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:36px 20px;text-align:center;color:#6e7681;font-size:13px}
.fcc-console-empty .ce-ico{width:40px;height:40px;opacity:.5}
.fcc-console-empty .ce-kbd{display:inline-flex;gap:4px;margin-top:4px}

/* footer */
.fcc-footer{margin-top:auto;background:var(--bg2);color:#c9d1d9;padding:10px 20px;font-size:12px;border-top:1px solid rgba(255,255,255,.07)}
.fcc-footer-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fcc-footer a{color:#99c1e8;text-decoration:none;font-weight:600}
.fcc-footer a:hover{text-decoration:underline}
.fcc-footer span:first-child{color:#8b949e}
.fcc-footer .grow{flex:1}

/* toast */
.fcc-toast-wrap{position:fixed;top:78px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.fcc-toast{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-border);box-shadow:var(--shadow);border-radius:12px;padding:12px 16px;min-width:240px;max-width:340px;display:flex;align-items:center;gap:10px;animation:fccslide .25s ease}
.fcc-toast.success{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.fcc-toast.error{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.fcc-toast.info{border-color:var(--accent);background:rgba(126,200,227,.1);color:#7ec8e3}
.fcc-toast .em{font-size:20px}
@keyframes fccslide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* confetti */
.fcc-confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.fcc-confetti span{position:absolute;top:-12px;width:10px;height:14px;opacity:.9;animation:fccfall linear forwards}
@keyframes fccfall{to{transform:translateY(105vh) rotate(540deg);opacity:1}}

/* modal */
.fcc-modal-back{position:fixed;inset:0;background:rgba(10,10,35,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.fcc-modal{background:var(--panel);border-radius:16px;max-width:440px;width:100%;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.fcc-modal .mh{background:var(--bg2);color:#fff;padding:16px 20px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}
.fcc-modal .mb{padding:20px;color:var(--text)}
.fcc-modal .mb p{margin:0 0 10px;color:var(--muted)}
.fcc-modal .mf{padding:14px 20px;border-top:1px solid var(--panel-border);display:flex;justify-content:flex-end;gap:8px}

/* hint */
.fcc-hint{margin:10px 0 0;background:#fff8e7;border:1px solid #f1be32;border-radius:10px;padding:12px 14px;font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap;color:#5b4a00}
[data-theme="dark"] .fcc-hint{background:#2a2410;color:#ffd970;border-color:#7a5a10}

/* mobile */
@media(max-width:1023px){
  .fcc-body{grid-template-columns:1fr}
  .fcc-sidebar{position:fixed;left:0;top:0;height:100vh;max-width:84vw;width:300px;z-index:60;transform:translateX(-105%);transition:transform .25s ease;border-right:1px solid rgba(255,255,255,.1)}
  .fcc-sidebar.open{transform:translateX(0)}
  .fcc-burger{display:inline-flex}
  .fcc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;backdrop-filter:blur(1px)}
  .fcc-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--yellow);position:sticky;top:0;z-index:2}
  .fcc-drawer-head .dh-title{display:flex;align-items:center;gap:8px;font-weight:800;color:#fff;font-size:15px}
  .fcc-drawer-close{background:rgba(255,255,255,.1);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .fcc-drawer-close:hover{background:rgba(255,255,255,.2)}
}
.fcc-header .fcc-brand-text{font-size:15.5px}
@media(max-width:560px){.fcc-stat span.lbl{display:none}.fcc-lesson-head .xptag{display:none}.fcc-brand-text small{display:none}}

/* kbd */
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:4px;background:rgba(0,0,0,.25);color:#c9d1d9;font-family:ui-monospace,monospace;font-size:10.5px;font-weight:700;border:1px solid rgba(255,255,255,.15);box-shadow:0 1px 0 rgba(0,0,0,.4);line-height:1}
[data-theme="light"] .kbd{background:#eaeef2;color:#1b1b32;border-color:#c7d2dc;box-shadow:0 1px 0 rgba(0,0,0,.08)}

/* achievements bar */
.fcc-achbar{display:flex;align-items:center;gap:6px;padding:0 20px 12px;background:var(--panel);border-bottom:1px solid var(--panel-border);flex-wrap:wrap}
.fcc-ach{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 6px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--panel-border);background:var(--panel2);color:var(--muted);transition:all .2s;position:relative}
.fcc-ach .aem{font-size:13px;filter:grayscale(1);opacity:.5;transition:all .25s}
.fcc-ach.unlocked{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.fcc-ach.unlocked .aem{filter:none;opacity:1}
.fcc-ach .atip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0a0a23;color:#fff;font-size:11px;font-weight:600;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fcc-ach .atip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#0a0a23}
.fcc-ach:hover .atip{opacity:1}

/* help modal list */
.fcc-help-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.fcc-help-list li{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text)}
.fcc-help-list .hk{display:inline-flex;gap:4px;flex:none;width:96px}
.fcc-help-list .desc{flex:1;color:var(--muted)}

/* REPL modal */
.fcc-repl-modal{max-width:760px;width:100%;max-height:85vh;display:flex;flex-direction:column}
.fcc-repl-modal .mh{background:var(--bg2);color:#fff;padding:14px 20px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--green)}
.fcc-repl-modal .mh .repl-badge{margin-left:auto;font-size:11px;font-weight:600;background:rgba(126,231,135,.15);color:var(--green);padding:3px 9px;border-radius:999px;border:1px solid rgba(126,231,135,.3)}
.fcc-repl-body{flex:1;display:flex;flex-direction:column;min-height:0;background:#010409}
.fcc-repl-output{flex:1;overflow:auto;padding:12px 16px;min-height:280px;max-height:55vh;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.55}
.fcc-repl-output::-webkit-scrollbar{width:10px;height:10px}
.fcc-repl-output::-webkit-scrollbar-thumb{background:#30363d;border-radius:8px}
.fcc-repl-output .rline{padding:2px 0;white-space:pre-wrap;word-break:break-word}
.fcc-repl-output .rline.in{color:#c9d1d9}
.fcc-repl-output .rline.in::before{content:'>>> ';color:var(--green);font-weight:700}
.fcc-repl-output .rline.out{color:#c9d1d9}
.fcc-repl-output .rline.err{color:#ff7b72}
.fcc-repl-output .rline.sys{color:#79c0ff}
.fcc-repl-output .rline.sys::before{content:'› ';color:#7ee787}
.fcc-repl-output .rline.placeholder{color:#6e7681;font-style:italic}
.fcc-repl-input-wrap{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0d1117;border-top:1px solid var(--code-border)}
.fcc-repl-prompt{color:var(--green);font-weight:700;font-family:ui-monospace,Menlo,monospace;font-size:13px;flex:none}
.fcc-repl-input{flex:1;background:#010409;border:1px solid var(--code-border);color:var(--code-fg);padding:8px 12px;border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px;outline:none;transition:border-color .15s}
.fcc-repl-input:focus{border-color:var(--green)}
.fcc-repl-run{background:var(--green);color:#0a0a23;border:none;font-weight:800;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.fcc-repl-run:hover{filter:brightness(1.1)}
.fcc-repl-run:disabled{opacity:.5;cursor:not-allowed}
.fcc-repl-clear{background:rgba(255,255,255,.06);color:#c9d1d9;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.fcc-repl-clear:hover{background:rgba(255,255,255,.12)}

/* cheat sheet modal */
.fcc-cheat-modal{max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.fcc-cheat-modal .mh{background:var(--bg2);color:#fff;padding:14px 20px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--yellow)}
.fcc-cheat-body{overflow:auto;padding:18px 22px 6px;max-height:74vh}
.fcc-cheat-body::-webkit-scrollbar{width:10px}
.fcc-cheat-body::-webkit-scrollbar-thumb{background:var(--code-border);border-radius:8px}
.fcc-cheat-section{margin-bottom:22px}
.fcc-cheat-section h3{margin:0 0 8px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);display:flex;align-items:center;gap:8px}
.fcc-cheat-section h3 .em{font-size:16px}
.fcc-cheat-grid{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:640px){.fcc-cheat-grid{grid-template-columns:1fr 1fr}}
.fcc-cheat-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--panel-border)}
.fcc-cheat-item:last-child{border-bottom:none}
.fcc-cheat-item code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--code-bg);color:var(--code-fg);padding:3px 8px;border-radius:5px;border:1px solid var(--code-border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fcc-cheat-item .ci-desc{font-size:12.5px;color:var(--muted);line-height:1.45}

/* secondary header buttons */
.fcc-hdr-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#c9d1d9;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .08s}
.fcc-hdr-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.fcc-hdr-btn:active{transform:translateY(1px)}
.fcc-hdr-btn svg{width:15px;height:15px}
@media(max-width:560px){.fcc-hdr-btn span.lbl{display:none}}

/* bookmarks */
.fcc-bm-btn{background:transparent;border:none;cursor:pointer;padding:4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,transform .1s;flex:none}
.fcc-bm-btn:hover{background:rgba(241,190,50,.12);transform:scale(1.1)}
.fcc-bm-btn svg{width:16px;height:16px;color:#8b949e;transition:color .15s}
.fcc-bm-btn.active svg{color:var(--yellow);fill:var(--yellow)}
.fcc-bm-filter{display:inline-flex;align-items:center;gap:5px;background:rgba(241,190,50,.1);border:1px solid rgba(241,190,50,.25);color:var(--yellow);padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;transition:background .12s}
.fcc-bm-filter:hover{background:rgba(241,190,50,.18)}
.fcc-bm-filter.active{background:var(--yellow);color:var(--yellow-fg)}
.fcc-bm-filter svg{width:13px;height:13px}

/* pystatus chip */
.fcc-pystatus{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#8b949e;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.fcc-pystatus .pdot{width:7px;height:7px;border-radius:50%;background:#6e7681}
.fcc-pystatus.ready .pdot{background:var(--green);box-shadow:0 0 6px var(--green)}
.fcc-pystatus.loading .pdot{background:var(--yellow);animation:fccblink 1s infinite}
.fcc-pystatus.error .pdot{background:var(--danger)}
@keyframes fccblink{50%{opacity:.3}}

/* menu */
.fcc-menu{position:relative}
.fcc-menu-pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;box-shadow:var(--shadow);min-width:200px;z-index:70;overflow:hidden}
.fcc-menu-pop button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--text);padding:10px 14px;font-size:13.5px;cursor:pointer;text-align:left;transition:background .12s}
.fcc-menu-pop button:hover{background:var(--panel2)}
.fcc-menu-pop button.danger{color:var(--danger)}
.fcc-menu-pop button svg{width:16px;height:16px;flex:none}

/* capstone banner */
.fcc-cap-banner{margin:0 20px 12px;padding:10px 14px;background:linear-gradient(90deg,rgba(241,190,50,.12),rgba(241,190,50,.04));border:1px solid rgba(241,190,50,.3);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text)}
.fcc-cap-banner .cb-ico{font-size:18px}
.fcc-cap-banner .cb-txt{font-weight:700}
.fcc-cap-banner .cb-sub{font-weight:500;color:var(--muted);font-size:12px}

/* fade animation */
.fcc-lesson-head,.fcc-instr,.fcc-editor-col{animation:fccfade .3s ease}
@keyframes fccfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fcc-stat.pulse{animation:fccpulse .5s ease}
@keyframes fccpulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* command palette */
.fcc-palette-back{position:fixed;inset:0;background:rgba(10,10,35,.6);z-index:110;display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px;backdrop-filter:blur(3px)}
.fcc-palette{background:var(--panel);border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--panel-border)}
.fcc-palette-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--panel-border)}
.fcc-palette-input-wrap svg{width:18px;height:18px;color:var(--muted);flex:none}
.fcc-palette-input{flex:1;background:transparent;border:none;color:var(--text);font-size:16px;outline:none;font-weight:600}
.fcc-palette-input::placeholder{color:var(--muted);font-weight:500}
.fcc-palette-kbd{font-size:10px;color:var(--muted);font-weight:700;background:var(--panel2);padding:3px 7px;border-radius:5px;border:1px solid var(--panel-border)}
.fcc-palette-list{max-height:340px;overflow:auto;padding:6px}
.fcc-palette-list::-webkit-scrollbar{width:8px}
.fcc-palette-list::-webkit-scrollbar-thumb{background:var(--panel-border);border-radius:8px}
.fcc-palette-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background .1s}
.fcc-palette-item:hover,.fcc-palette-item.sel{background:var(--panel2)}
.fcc-palette-item.sel{box-shadow:inset 0 0 0 2px var(--yellow)}
.fcc-palette-item .pi-ico{width:28px;height:28px;flex:none;border-radius:7px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px}
.fcc-palette-item .pi-main{flex:1;min-width:0}
.fcc-palette-item .pi-title{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcc-palette-item .pi-sub{font-size:11px;color:var(--muted);margin-top:1px}
.fcc-palette-item .pi-status{flex:none;font-size:11px;color:var(--muted)}
.fcc-palette-item .pi-status.done{color:var(--green)}
.fcc-palette-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
.fcc-palette-foot{padding:8px 14px;border-top:1px solid var(--panel-border);display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted)}
.fcc-palette-foot .kbd{margin-right:3px}

/* stats dashboard */
.fcc-stats-modal{max-width:540px;width:100%}
.fcc-stats-modal .mh{background:var(--bg2);color:#fff;padding:14px 20px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--accent)}
.fcc-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 20px 8px}
.fcc-stat-card{background:var(--panel2);border:1px solid var(--panel-border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.fcc-stat-card .sc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.fcc-stat-card .sc-value{font-size:24px;font-weight:800;color:var(--text);line-height:1.1;font-variant-numeric:tabular-nums}
.fcc-stat-card .sc-sub{font-size:11.5px;color:var(--muted)}
.fcc-stat-card.accent .sc-value{color:var(--accent)}
.fcc-stat-card.green .sc-value{color:var(--green)}
.fcc-stat-card.yellow .sc-value{color:var(--yellow)}
.fcc-stat-card.red .sc-value{color:#ff7b72}
.fcc-stats-list{padding:0 20px 14px}
.fcc-stats-list h3{margin:6px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.fcc-stats-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--panel-border);font-size:13px}
.fcc-stats-row:last-child{border-bottom:none}
.fcc-stats-row .sr-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.fcc-stats-row .sr-r{flex:none;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* copy button */
.fcc-copy-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#c9d1d9;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;transition:background .12s}
.fcc-copy-btn:hover{background:rgba(255,255,255,.14)}
.fcc-copy-btn svg{width:12px;height:12px}

/* activity chart */
.fcc-activity-chart{padding:4px 20px 14px}
.fcc-activity-chart h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.fcc-activity-bars{display:flex;align-items:flex-end;gap:4px;height:64px;padding-bottom:18px;position:relative;border-bottom:1px solid var(--panel-border)}
.fcc-activity-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default}
.fcc-activity-bar .bar-fill{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--accent),#5aa8c9);min-height:2px;transition:height .4s cubic-bezier(.2,.8,.2,1);opacity:.85}
.fcc-activity-bar.today .bar-fill{background:linear-gradient(180deg,var(--green),#5cb85c);opacity:1;box-shadow:0 0 8px rgba(126,231,135,.4)}
.fcc-activity-bar:hover .bar-fill{opacity:1}
.fcc-activity-bar .bar-tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#0a0a23;color:#fff;font-size:10px;font-weight:600;padding:3px 6px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;z-index:5}
.fcc-activity-bar:hover .bar-tip{opacity:1}
.fcc-activity-empty{font-size:12px;color:var(--muted);text-align:center;padding:12px 0}

/* auto-advance toggle */
.fcc-switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.fcc-switch input{opacity:0;width:0;height:0;position:absolute}
.fcc-switch .track{position:absolute;inset:0;background:var(--bg3);border-radius:999px;transition:background .2s}
.fcc-switch .thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.fcc-switch input:checked ~ .track{background:var(--green)}
.fcc-switch input:checked ~ .thumb{transform:translateX(16px)}

/* onboarding modal */
.fcc-onboard{max-width:560px;width:100%}
.fcc-onboard .mh{background:linear-gradient(135deg,var(--bg),var(--bg2));color:#fff;padding:22px 24px;font-weight:800;font-size:18px;display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--yellow)}
.fcc-onboard .mh .oh-sub{font-size:12.5px;font-weight:500;color:#99c1e8}
.fcc-onboard .ob-body{padding:20px 24px}
.fcc-onboard .ob-step{display:flex;gap:12px;padding:8px 0;align-items:flex-start}
.fcc-onboard .ob-step .ob-ico{width:32px;height:32px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--panel2);border:1px solid var(--panel-border)}
.fcc-onboard .ob-step .ob-txt{flex:1}
.fcc-onboard .ob-step .ob-title{font-size:13.5px;font-weight:700;color:var(--text)}
.fcc-onboard .ob-step .ob-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.fcc-onboard .ob-tip{margin-top:12px;padding:10px 14px;background:var(--green-bg);border:1px solid var(--green);border-radius:8px;font-size:12.5px;color:var(--text)}
.fcc-onboard .ob-tip b{color:var(--green)}

/* status filter pills */
.fcc-status-filters{display:flex;gap:5px;padding:8px 12px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.fcc-status-pill{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#8b949e;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;text-align:center}
.fcc-status-pill:hover{background:rgba(255,255,255,.1);color:#c9d1d9}
.fcc-status-pill.active{background:#7ec8e3;color:#0a0a23;border-color:var(--accent)}
</style>

/* ------------------------------------------------------- подсветка синтаксиса */
const PY_KEYWORDS = new Set([
  'def', 'return', 'if', 'elif', 'else', 'for', 'while', 'in', 'not', 'and',
  'or', 'import', 'from', 'as', 'class', 'pass', 'break', 'continue', 'True',
  'False', 'None', 'lambda', 'with', 'try', 'except', 'finally', 'raise',
  'yield', 'global', 'nonlocal', 'del', 'is', 'assert', 'async', 'await',
])
const PY_BUILTINS = new Set([
  'print', 'len', 'range', 'str', 'int', 'float', 'list', 'dict', 'set',
  'tuple', 'bool', 'input', 'type', 'enumerate', 'zip', 'map', 'filter',
  'sum', 'min', 'max', 'abs', 'sorted', 'reversed', 'open', 'format',
  'isinstance', 'getattr', 'setattr', 'hasattr', 'super',
])
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}
const TOKEN_RE = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d+\.?\d*(?:e[+-]?\d+)?\b)|(\b[A-Za-z_]\w*\b)/g
function highlightPython(code) {
  let out = ''
  let last = 0
  let m
  TOKEN_RE.lastIndex = 0
  while ((m = TOKEN_RE.exec(code))) {
    out += escapeHtml(code.slice(last, m.index))
    const [full, comment, tripleStr, str, num, ident] = m
    if (comment) out += '<span class="t-com">' + escapeHtml(comment) + '</span>'
    else if (tripleStr) out += '<span class="t-str">' + escapeHtml(tripleStr) + '</span>'
    else if (str) out += '<span class="t-str">' + escapeHtml(str) + '</span>'
    else if (num) out += '<span class="t-num">' + escapeHtml(num) + '</span>'
    else if (ident) {
      if (PY_KEYWORDS.has(ident)) out += '<span class="t-kw">' + ident + '</span>'
      else if (PY_BUILTINS.has(ident)) out += '<span class="t-bi">' + ident + '</span>'
      else out += ident
    }
    last = m.index + full.length
  }
  out += escapeHtml(code.slice(last))
  return out
}

const PYODIDE_VERSION = 'v0.26.2'
const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/' + PYODIDE_VERSION + '/full'
const RUN_TIMEOUT_MS = 6000

const WORKER_SRC = `
let pyodide = null;
let ready = false;
let replNs = null;
async function init(onMsg) {
  onMsg({ type: 'status', status: 'loading' });
  try {
    importScripts('${PYODIDE_BASE}/pyodide.js');
    pyodide = await self.loadPyodide({ indexURL: '${PYODIDE_BASE}/' });
    ready = true;
    replNs = pyodide.globals.get('dict')();
    onMsg({ type: 'status', status: 'ready' });
  } catch (e) {
    onMsg({ type: 'status', status: 'error', error: String(e && e.message || e) });
  }
}
function runJob(job) {
  let out = '';
  pyodide.setStdout({ batched: function (s) { out += s; } });
  pyodide.setStderr({ batched: function (s) { out += s; } });
  var ns = job.mode === 'repl' ? replNs : pyodide.globals.get('dict')();
  let runError = null;
  try { pyodide.runPython(job.code, { globals: ns }); }
  catch (e) { runError = String(e && e.message || e); }
  let testResults = null;
  if (job.tests && job.tests.length) {
    testResults = job.tests.map(function (t) {
      var label = t.name || (t.type === 'expr' ? t.expr : t.value);
      var ok = false;
      try {
        if (t.type === 'stdout') ok = out.indexOf(t.value) !== -1;
        else if (t.type === 'stdout_exact') ok = out.replace(/\\s+$/, '') === String(t.value).replace(/\\s+$/, '');
        else if (t.type === 'expr') ok = !!pyodide.runPython('bool(' + t.expr + ')', { globals: ns });
      } catch (e) { ok = false; }
      return { name: String(label), pass: ok };
    });
  }
  return { type: 'result', ok: !runError, stdout: out, error: runError, testResults: testResults };
}
self.onmessage = function (ev) {
  const data = ev.data;
  if (data.type === 'run') {
    if (!ready) { self.postMessage({ type: 'error', error: 'Python ещё не загружен' }); return; }
    try { const res = runJob(data); res.id = data.id; self.postMessage(res); }
    catch (e) { self.postMessage({ type: 'error', id: data.id, error: String(e && e.message || e) }); }
  } else if (data.type === 'repl-reset') {
    try { replNs = pyodide ? pyodide.globals.get('dict')() : null; } catch (e) {}
  }
};
init(self.postMessage);
`

    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCheck(true); return }
    if (e.key === 'Tab') {
      e.preventDefault()
      const ta = e.currentTarget
      const s = ta.selectionStart, en = ta.selectionEnd
      const newVal = code.slice(0, s) + '    ' + code.slice(en)
      setCode(newVal)
      requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = s + 4 })
    }
  }

  const runInWorker = useCallback((code, tests, mode) => {
    return new Promise((resolve) => {
      const w = workerRef.current
      if (!w) { resolve({ ok: false, stdout: '', error: 'Окружение не инициализировано' }); return }
      const id = ++jobIdRef.current
      const timer = setTimeout(() => {
        pendingRef.current.delete(id)
        const old = workerRef.current
        if (old) old.terminate()
        try {
          const blob = new Blob([WORKER_SRC], { type: 'application/javascript' })
          const url = URL.createObjectURL(blob)
          const nw = new Worker(url)
          workerRef.current = nw
          workerStatusRef.current = 'loading'
          setPyState('loading')
          nw.onmessage = (ev) => {
            const data = ev.data
            if (data.type === 'status') { workerStatusRef.current = data.status || 'idle'; setPyState(data.status || 'idle'); return }
            if (data.type === 'result' || data.type === 'error') {
              const jid = data.id; const job = jid != null ? pendingRef.current.get(jid) : undefined
              if (!job) return
              clearTimeout(job.timer); pendingRef.current.delete(jid)
              if (data.type === 'error') job.resolve({ ok: false, stdout: '', error: data.error || '' })
              else job.resolve({ ok: !!data.ok, stdout: data.stdout || '', error: data.error, testResults: data.testResults || undefined })
            }
          }
          setTimeout(() => URL.revokeObjectURL(url), 5000)
        } catch { workerRef.current = null }
        resolve({ ok: false, stdout: '', error: '⏱ Превышено время выполнения (' + Math.round(RUN_TIMEOUT_MS / 1000) + ' с). Возможно, в коде бесконечный цикл. Worker перезапущен.' })
      }, RUN_TIMEOUT_MS)
      pendingRef.current.set(id, { code, tests, resolve, timer })
      w.postMessage({ type: 'run', id, code, tests, mode: mode || 'lesson' })
    })
  }, [])

  async function runCheck(check) {
    if (isRunning) return
    setIsRunning(true)
    if (!check) setConsoleLines([])
    pushConsole('sys', check ? '› Проверка решения…' : '› Запуск кода…')
    if (workerStatusRef.current !== 'ready') pushConsole('info', 'Python ещё загружается, подожди…')
    const tests = check
      ? current.tests.map((t) => ({ type: t.type, value: 'value' in t ? t.value : undefined, expr: 'expr' in t ? t.expr : undefined, name: t.name }))
      : []
    const res = await runInWorker(code, tests)
    if (res.error) pushConsole('err', res.error)
    if (res.stdout.trim()) pushConsole('out', res.stdout.replace(/\n$/, ''))
    else if (!res.error && !check) pushConsole('info', '(программа завершилась без вывода)')
    if (check && res.testResults) {
      setTestResults(res.testResults); setTab('tests')
      const allPass = res.testResults.every((r) => r.pass)
      if (allPass && res.ok) markDone(current.id)
      else if (!res.ok && res.error && !res.testResults.length) showToast('error', 'В коде ошибка выполнения')
      else showToast('error', 'Некоторые тесты не пройдены')
    }
    setIsRunning(false)
  }

      const next = { ...prev, [id]: true }

      setActivity((a) => ({ ...a, [today]: (a[today] || 0) + 1 }))
      const completedCount = Object.keys(next).length
      const ach = computeAchievements(completedCount)
      const newlyUnlocked = ach.find((a) => !a.unlocked_before && a.unlocked)
      if (newlyUnlocked) setTimeout(() => showToast('success', '🏆 Достижение: ' + newlyUnlocked.title), 900)
      if (completedCount >= TOTAL_LESSONS) setTimeout(() => setCertOpen(true), 700)
      const idx = ALL_LESSONS.findIndex((l) => l.id === id)

  function computeAchievements(count) {
    const oldCount = Object.keys(done).filter((k) => done[k]).length

  async function runRepl() {
    const src = replInput.trim()
    if (!src || replRunning) return
    setReplRunning(true)
    setReplHistory((h) => [...h, { type: 'in', text: src }])
    setReplInput('')

      setReplHistory((h) => [...h, { type: 'sys', text: 'Python ещё загружается, подожди и попробуй снова…' }])
      setReplRunning(false); return
    }
    const wrapped = '__r = None\ntry:\n    __r = eval(' + JSON.stringify(src) + ')\n    if __r is not None:\n        print(repr(__r))\nexcept SyntaxError:\n    try:\n        exec(' + JSON.stringify(src) + ')\n    except Exception as __e:\n        print(__e)\nexcept Exception as __e:\n    print(__e)\n'
    const res = await runInWorker(wrapped, [], 'repl')
    if (res.error) setReplHistory((h) => [...h, { type: 'err', text: res.error || '' }])
    if (res.stdout.trim()) setReplHistory((h) => [...h, { type: 'out', text: res.stdout.replace(/\n$/, '') }])

              const mDone = allModuleItems.filter((l) => done[l.id]).length
              const mTotal = allModuleItems.length
              const mComplete = mDone === mTotal && mTotal > 0
              const open = query.trim() ? true : !!openModules[m.id]
              let visibleLessons = allModuleItems
              if (bookmarkFilter) visibleLessons = visibleLessons.filter((l) => bookmarks[l.id])

            </div>
            <div className="fcc-stats-grid">
              <div className="fcc-stat-card yellow"><span className="sc-label">Опыт (XP)</span><span className="sc-value">{xp}</span><span className="sc-sub">{completedCount} из {TOTAL_LESSONS} уроков</span></div>
              <div className="fcc-stat-card green"><span className="sc-label">Прогресс</span><span className="sc-value">{progressPct}%</span><span className="sc-sub">{completedCount}/{TOTAL_LESSONS} пройдено</span></div>
              <div className="fcc-stat-card accent"><span className="sc-label">Серия дней</span><span className="sc-value">{streak.count} 🔥</span><span className="sc-sub">{streak.lastDay ? 'последний: ' + streak.lastDay : 'начни сегодня'}</span></div>
              <div className="fcc-stat-card red"><span className="sc-label">Время в обучении</span><span className="sc-value">{fmtTime(totalSeconds)}</span><span className="sc-sub">~{fmtTime(avgPerLesson)} на урок</span></div>
            </div>
            <div className="fcc-stats-list">
              <h3>Дополнительно</h3>
              <div className="fcc-stats-row"><span className="sr-l">🏆 Capstone-проекты выполнено</span><span className="sr-r">{capstoneDone} / 7</span></div>
              <div className="fcc-stats-row"><span className="sr-l">🔖 Закладок</span><span className="sr-r">{bookmarksCount}</span></div>
              <div className="fcc-stats-row"><span className="sr-l">🎯 Достижений разблокировано</span><span className="sr-r">{achievements.filter((a) => a.unlocked).length} / {achievements.length}</span></div>
              <div className="fcc-stats-row"><span className="sr-l">⏱ Текущий урок</span><span className="sr-r">{Math.floor(lessonSeconds / 60)}:{String(lessonSeconds % 60).padStart(2, '0')}</span></div>
            </div>
            <div className="fcc-activity-chart">
              <h3>Активность за 14 дней</h3>
              {activityData.every((d) => d.count === 0) ? (
                <div className="fcc-activity-empty">Пока нет активности — реши урок, чтобы заполнить график</div>
              ) : (
                <div className="fcc-activity-bars">
                  {activityData.map((d, i) => (
                    <div key={d.date} className={'fcc-activity-bar' + (i === activityData.length - 1 ? ' today' : '')} title={d.date}>
                      <span className="bar-tip">{d.count} уроков · {d.date}</span>
                      <div className="bar-fill" style={{ height: Math.max(2, (d.count / maxActivity) * 100) + '%' }} />
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="mf"><button className="fcc-btn check" onClick={() => setStatsOpen(false)}>Закрыть</button></div>
          </div>
        </div>
      )}

      {onboardOpen && (
        <div className="fcc-modal-back" onClick={dismissOnboard}>
          <div className="fcc-modal fcc-onboard" onClick={(e) => e.stopPropagation()}>
            <div className="mh">Добро пожаловать в курс Python! 🐍<span className="oh-sub">{TOTAL_LESSONS} уроков · 7 модулей · реальное выполнение Python в браузере</span></div>
            <div className="ob-body">
              <div className="ob-step"><span className="ob-ico">📖</span><span className="ob-txt"><div className="ob-title">Читай теорию</div><div className="ob-desc">Каждый урок начинается с объяснения и примера кода</div></span></div>
              <div className="ob-step"><span className="ob-ico">✏️</span><span className="ob-txt"><div className="ob-title">Допиши код в редакторе</div><div className="ob-desc">Редактор с подсветкой синтаксиса. Tab — отступ, Ctrl+Enter — запуск</div></span></div>
              <div className="ob-step"><span className="ob-ico">▶</span><span className="ob-txt"><div className="ob-title">Запусти и проверь</div><div className="ob-desc">«Запустить» — увидеть вывод, «Проверить» — пройти тесты и получить XP</div></span></div>
              <div className="ob-step"><span className="ob-ico">⌘K</span><span className="ob-txt"><div className="ob-title">Командная палитра</div><div className="ob-desc">Быстрый переход к любому уроку — нажми Ctrl/Cmd+K</div></span></div>
              <div className="ob-tip">💡 <b>Совет:</b> включи «Авто-переход» внизу урока, чтобы после выполнения автоматически переходить к следующему.</div>
            </div>
            <div className="mf"><button className="fcc-btn check" onClick={dismissOnboard}>Начать обучение →</button></div>
          </div>
        </div>
      )}
    </div>
  )
}

/* шпаргалка по Python */
function CheatSheet() {
  const sections = [
    { em: '🖨️', title: 'Ввод / вывод', items: [['print(x)', 'вывести значение на экран'], ['print(a, b)', 'вывести несколько значений через пробел'], ['input("→ ")', 'прочитать строку с клавиатуры'], ['f"{x}"', 'f-строка: вставить значение x в текст']] },
    { em: '🔢', title: 'Типы и преобразование', items: [['int("42")', 'строка → целое число'], ['float("3.14")', 'строка → дробное число'], ['str(42)', 'число → строка'], ['type(x)', 'узнать тип значения x']] },
    { em: '➗', title: 'Арифметика', items: [['a + b', 'сложение'], ['a // b', 'целочисленное деление'], ['a % b', 'остаток от деления'], ['a ** b', 'возведение в степень']] },
    { em: '🔀', title: 'Условия', items: [['if x > 0:', 'если условие истинно'], ['elif x == 0:', 'иначе если'], ['else:', 'во всех остальных случаях'], ['and / or / not', 'логические И / ИЛИ / НЕ']] },
    { em: '🔁', title: 'Циклы', items: [['for i in range(n):', 'повторить n раз (i = 0..n-1)'], ['for x in список:', 'перебрать элементы'], ['while условие:', 'пока условие истинно'], ['break / continue', 'прервать / пропустить итерацию']] },
    { em: '📦', title: 'Структуры данных', items: [['[1, 2, 3]', 'список (изменяемый)'], ['(1, 2, 3)', 'кортеж (неизменяемый)'], ['{"k": "v"}', 'словарь (ключ:значение)'], ['{1, 2, 3}', 'множество (уникальные)']] },
    { em: '🔤', title: 'Строки', items: [['s.upper()', 'в верхний регистр'], ['s.split(",")', 'разбить по разделителю'], ['s.replace("a","b")', 'заменить подстроку'], ['s[1:4]', 'срез символов с 1 по 3']] },
    { em: '⚙️', title: 'Функции', items: [['def f(x):', 'определить функцию'], ['return x', 'вернуть значение'], ['lambda x: x*2', 'анонимная функция'], ['f(a, b=5)', 'аргумент по умолчанию']] },
  ]
  return (
    <>
      {sections.map((s, i) => (
        <div key={i} className="fcc-cheat-section">
          <h3><span className="em">{s.em}</span>{s.title}</h3>
          <div className="fcc-cheat-grid">
            {s.items.map((it, j) => (
              <div key={j} className="fcc-cheat-item"><code>{it[0]}</code><span className="ci-desc">{it[1]}</span></div>
            ))}
          </div>
        </div>
      ))}
    </>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<Home />)

<script>
/* Manual Babel transform with classic runtime (React.createElement) —
   avoids the "Cannot use import statement outside a module" error from
   the automatic JSX runtime. Run after window load to ensure React/ReactDOM/Babel
   are all ready. */
window.addEventListener('load', function () {
  try {
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'app.js',
    }).code;
    var s = document.createElement('script');
    s.textContent = out;
    document.body.appendChild(s);
  } catch (e) {
    console.error('Babel transform failed:', e);
    var d = document.getElementById('root');
    if (d) d.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#0a0a23">Ошибка загрузки приложения: ' + (e && e.message || e) + '</div>';
  }
});
</script>
</body>
